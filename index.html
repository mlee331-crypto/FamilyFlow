<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6feb">
<link rel="manifest" href="manifest.webmanifest">
<title>FamilyFlow — Chores & Rewards</title>
<style>
:root{
  --bg:#f5f7fb;--card:#fff;--ink:#152033;--muted:#667085;--line:#e6eaf0;
  --accent:#1f6feb;--accent2:#7c3aed;--good:#16803c;--warn:#b54708;--bad:#b42318;
  --shadow:0 8px 28px rgba(31,45,61,.08);--radius:22px;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
button,input,select{font:inherit}
button{cursor:pointer}
.app{max-width:1180px;margin:auto;min-height:100vh;padding-bottom:92px}
.topbar{position:sticky;top:0;z-index:20;background:rgba(245,247,251,.92);backdrop-filter:blur(16px);border-bottom:1px solid rgba(230,234,240,.9);padding:12px 16px;display:flex;align-items:center;gap:10px}
.brand{font-weight:900;letter-spacing:-.04em;font-size:21px;white-space:nowrap}
.brand span{color:var(--accent)}
.spacer{flex:1}
.mode-btn,.pill-btn,.icon-btn{border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px 12px;color:var(--ink);font-weight:700}
.mode-btn.active{background:var(--ink);color:#fff;border-color:var(--ink)}
main{padding:18px 16px 30px}
h1{font-size:31px;line-height:1.05;margin:6px 0 6px;letter-spacing:-.04em}
h2{font-size:22px;margin:0 0 12px;letter-spacing:-.025em}
h3{font-size:16px;margin:0}
p{margin:0;color:var(--muted)}
.grid{display:grid;gap:14px}
.grid.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:17px}
.stat{padding:14px}
.stat b{font-size:25px;display:block;margin-top:5px}
.muted{color:var(--muted)}
.small{font-size:12px}
.hero{padding:18px;background:linear-gradient(135deg,#eef5ff,#f4efff)}
.progress{height:10px;background:#e9edf4;border-radius:99px;overflow:hidden}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px}
.kid-card{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.avatar{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;background:#eef4ff;color:var(--accent);font-weight:900;font-size:20px}
.balance{font-weight:900;font-size:20px;text-align:right}
.tag{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:6px 9px;background:#f0f3f7;color:#475467;font-size:12px;font-weight:800}
.tag.good{background:#eaf8ef;color:var(--good)}
.tag.warn{background:#fff3e7;color:var(--warn)}
.tag.bad{background:#ffefed;color:var(--bad)}
.tag.blue{background:#edf4ff;color:var(--accent)}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 0 10px}
.task{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0;padding-top:0}
.task-title{font-weight:850;margin-bottom:5px}
.reward{font-weight:900;color:var(--good)}
.done-btn,.primary{border:0;border-radius:15px;background:var(--accent);color:#fff;font-weight:850;padding:12px 16px;min-height:46px}
.secondary{border:1px solid var(--line);border-radius:15px;background:#fff;color:var(--ink);font-weight:800;padding:11px 14px;min-height:44px}
.danger{border-color:#f5c2bd;color:var(--bad);background:#fff6f5}
.success{background:var(--good)}
.reject{background:#fff;color:var(--bad);border:1px solid #f0b9b5}
.pending{background:#fff7ed;border:1px solid #fed7aa}
.big-balance{font-size:42px;font-weight:950;letter-spacing:-.05em;margin:4px 0}
.bottomnav{position:fixed;z-index:30;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:max(7px,env(safe-area-inset-bottom)) 8px calc(7px + env(safe-area-inset-bottom));display:flex;justify-content:center}
.bottomnav .navwrap{width:min(100%,900px);display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.navitem{border:0;background:transparent;border-radius:12px;padding:8px 5px;color:#667085;font-weight:800;font-size:11px}
.navitem span{display:block;font-size:19px;margin-bottom:2px}
.navitem.active{background:#edf4ff;color:var(--accent)}
.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:4px}
.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:99px;padding:9px 12px;font-weight:800;color:#667085}
.tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.toolbar{display:grid;grid-template-columns:1fr auto auto;gap:8px}
.search,.select{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 13px;outline:none}
.library{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.libcard{border:1px solid var(--line);border-radius:17px;padding:14px;background:#fff}
.libcard.selected{outline:3px solid #bcd3ff;border-color:var(--accent)}
.lib-top{display:flex;justify-content:space-between;gap:8px}
.check{width:22px;height:22px}
.modalback{position:fixed;z-index:100;inset:0;background:rgba(17,24,39,.45);display:grid;place-items:end center;padding:0}
.modal{width:min(100%,650px);max-height:88vh;overflow:auto;background:#fff;border-radius:26px 26px 0 0;padding:20px 18px 28px;box-shadow:0 -15px 60px rgba(0,0,0,.2)}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{font-size:12px;font-weight:800;color:#475467}
label input,label select{margin-top:6px}
.input{width:100%;border:1px solid var(--line);border-radius:13px;padding:11px 12px;background:#fff}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.divider{height:1px;background:var(--line);margin:15px 0}
.empty{padding:28px;text-align:center;color:var(--muted)}
.table{width:100%;border-collapse:collapse}
.table th,.table td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line);font-size:13px}
.table th{color:#667085;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.ledger-pos{color:var(--good);font-weight:900}.ledger-neg{color:var(--bad);font-weight:900}
.ring{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--pct)*1%),#e9edf4 0);position:relative}
.ring:after{content:"";position:absolute;width:56px;height:56px;background:#fff;border-radius:50%}
.ring b{z-index:2}
.login{max-width:460px;margin:9vh auto 0}
.pin{font-size:26px;letter-spacing:.32em;text-align:center;font-weight:900}
.notice{border-radius:14px;padding:11px 12px;background:#eef5ff;color:#264c87;font-size:13px}
.toast{position:fixed;z-index:200;left:50%;bottom:95px;transform:translateX(-50%);background:#111827;color:#fff;border-radius:99px;padding:10px 15px;font-weight:800;font-size:13px;box-shadow:var(--shadow)}
.badge{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:16px;background:#fff}.badge .ico{font-size:28px}
@media(max-width:760px){
  .grid.cols-4,.grid.cols-3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid.cols-2{grid-template-columns:1fr}
  .library{grid-template-columns:1fr}
  .toolbar{grid-template-columns:1fr}
  h1{font-size:27px}
  .topbar .mode-btn{padding:9px 10px;font-size:12px}
}
@media(max-width:430px){
  main{padding-left:12px;padding-right:12px}
  .card{padding:14px;border-radius:18px}
  .kid-card{grid-template-columns:auto 1fr}
  .kid-card .balance{grid-column:1/-1;text-align:left}
  .formgrid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="app" class="app"></div>
<script>
const DB_KEY='familyflow-prototype-v1';
const todayISO=()=>new Date().toISOString().slice(0,10);
const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n);
const nowTime=()=>new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
const uuid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);

const choreLibrary=[
['Make bed','Bedroom','3–5','Daily','Easy','responsibility'],
['Put dirty clothes in hamper','Bedroom','3–5','Daily','Easy','responsibility'],
['Pick up toys','Playroom','3–5','Daily','Easy','responsibility'],
['Put books back on shelf','Playroom','3–5','Daily','Easy','responsibility'],
['Take plate to sink','Kitchen','3–5','Daily','Easy','responsibility'],
['Brush teeth','Personal Responsibility','3–5','Twice daily','Easy','responsibility'],
['Help wipe table','Helping Family','3–5','As needed','Easy','responsibility'],
['Clean up playroom','Playroom','6–8','Daily','Easy','responsibility'],
['Set table','Kitchen','6–8','Daily','Easy','earned'],
['Fold towels','Laundry','6–8','Weekly','Medium','earned'],
['Feed pet','Pets','6–8','Daily','Easy','responsibility'],
['Empty bedroom trash','Trash & Recycling','6–8','Weekly','Easy','earned'],
['Pack backpack','School','6–8','School days','Easy','responsibility'],
['Load dishwasher','Kitchen','9–12','Daily','Medium','earned'],
['Unload dishwasher','Kitchen','9–12','Daily','Medium','earned'],
['Vacuum bedroom','Bedroom','9–12','Weekly','Medium','earned'],
['Clean sink','Bathroom','9–12','Weekly','Medium','earned'],
['Bring empty bins back','Trash & Recycling','9–12','Weekly','Medium','earned'],
['Help wash car','Outdoor','9–12','As needed','Medium','bonus'],
['Fully clean bedroom','Bedroom','13–15','Weekly','Medium','responsibility'],
['Wash own laundry','Laundry','13–15','Weekly','Medium','responsibility'],
['Clean toilet','Bathroom','13–15','Weekly','Medium','earned'],
['Take garbage bins to curb','Trash & Recycling','13–15','Weekly','Medium','earned'],
['Mow lawn with parent approval','Outdoor','13–15','Weekly','Hard','earned'],
['Wash car','Outdoor','13–15','As needed','Medium','bonus'],
['Help make family dinner','Helping Family','13–15','Weekly','Medium','earned'],
['Cook family dinner','Kitchen','16–18','Weekly','Hard','earned'],
['Grocery shopping from a list','Helping Family','16–18','As needed','Medium','earned'],
['Deep clean kitchen','Kitchen','16–18','Monthly','Hard','earned'],
['Organize garage','Family Areas','16–18','Monthly','Hard','bonus']
].map((x,i)=>({id:'lib'+i,name:x[0],category:x[1],age:x[2],frequency:x[3],difficulty:x[4],suggestedType:x[5],favorite:i<3,popular:i%4===0}));

const packs=[
{name:'Morning Routine',items:['Make bed','Get dressed','Put pajamas away','Brush teeth','Put breakfast dishes in sink']},
{name:'After School Reset',items:['Put shoes away','Put backpack away','Put lunchbox in kitchen','Complete homework','Pick up personal items']},
{name:'Bedtime Reset',items:['Pick up bedroom','Put dirty clothes in hamper','Put toys away','Brush teeth','Put electronics away']},
{name:'Playroom Reset',items:['Put toys in bins','Put books away','Put craft supplies away','Pick up floor','Put games away']},
{name:'Kitchen Helper',items:['Clear table','Load dishwasher','Wipe table','Sweep floor']},
{name:'Teen Weekly Responsibilities',items:['Take trash to curb','Unload dishwasher','Clean bathroom','Wash own laundry','Clean bedroom']}
];

function seed(){
 const d=todayISO();
 return {
  family:{id:'fam-demo',name:'The Carter Family',parentPin:'2468',settings:{smallMinutes:5,mediumMinutes:10,largeMinutes:20,smallMoney:1,mediumMoney:3,largeMoney:5,dailyTabletLimit:60,minRedemption:15}},
  children:[
   {id:'c1',name:'Ava',age:6,rewardType:'minutes',pin:'1111',streak:6,avatar:'A',weeklyPct:92,badges:['Room Reset Pro','Morning Star']},
   {id:'c2',name:'Mia',age:4,rewardType:'minutes',pin:'2222',streak:3,avatar:'M',weeklyPct:81,badges:['Toy Tamer']},
   {id:'c3',name:'Jack',age:14,rewardType:'money',pin:'3333',streak:4,avatar:'J',weeklyPct:88,badges:['Kitchen Closer','Trash Captain']}
  ],
  chores:[
   {id:'ch1',name:'Make bed',category:'Bedroom',type:'responsibility',childIds:['c1'],reward:0,deduction:5,approval:true,schedule:'Daily',due:'8:00 AM',active:true},
   {id:'ch2',name:'Clean up playroom',category:'Playroom',type:'earned',childIds:['c1'],reward:15,deduction:0,approval:true,schedule:'Daily',due:'6:00 PM',active:true},
   {id:'ch3',name:'Brush teeth',category:'Personal Responsibility',type:'responsibility',childIds:['c2'],reward:0,deduction:5,approval:true,schedule:'Daily',due:'8:00 PM',active:true},
   {id:'ch4',name:'Put toys in bins',category:'Playroom',type:'earned',childIds:['c2'],reward:10,deduction:0,approval:true,schedule:'Daily',due:'6:30 PM',active:true},
   {id:'ch5',name:'Unload dishwasher',category:'Kitchen',type:'earned',childIds:['c3'],reward:2,deduction:1,approval:true,schedule:'Daily',due:'5:00 PM',active:true},
   {id:'ch6',name:'Take garbage bins to curb',category:'Trash & Recycling',type:'earned',childIds:['c3'],reward:4,deduction:2,approval:true,schedule:'Weekly • Thursday',due:'8:00 PM',active:true},
   {id:'ch7',name:'Wash Dad’s car',category:'Outdoor',type:'bonus',childIds:['c3'],reward:10,deduction:0,approval:true,schedule:'Bonus job',due:'',active:true,claimable:true},
   {id:'ch8',name:'Help rake leaves',category:'Outdoor',type:'bonus',childIds:['c1','c2'],reward:15,deduction:0,approval:true,schedule:'Bonus job',due:'',active:true,claimable:true}
  ],
  instances:[
   {id:'i1',choreId:'ch1',childId:'c1',date:d,status:'todo'},
   {id:'i2',choreId:'ch2',childId:'c1',date:d,status:'pending',submittedAt:'7:40 AM'},
   {id:'i3',choreId:'ch3',childId:'c2',date:d,status:'todo'},
   {id:'i4',choreId:'ch4',childId:'c2',date:d,status:'approved'},
   {id:'i5',choreId:'ch5',childId:'c3',date:d,status:'pending',submittedAt:'7:55 AM'},
   {id:'i6',choreId:'ch6',childId:'c3',date:d,status:'todo'}
  ],
  approvals:[
   {id:'a1',kind:'chore',instanceId:'i2',childId:'c1',title:'Clean up playroom',amount:15,status:'pending'},
   {id:'a2',kind:'chore',instanceId:'i5',childId:'c3',title:'Unload dishwasher',amount:2,status:'pending'},
   {id:'a3',kind:'redemption',childId:'c2',title:'Tablet time request',amount:30,status:'pending'}
  ],
  ledger:[
   {id:uuid(),date:d,time:'7:10 AM',childId:'c1',reason:'Morning routine bonus',amount:20,type:'bonus',approvedBy:'Parent'},
   {id:uuid(),date:d,time:'7:20 AM',childId:'c1',reason:'Playroom not cleaned yesterday',amount:-10,type:'deduction',approvedBy:'Parent'},
   {id:uuid(),date:d,time:'7:30 AM',childId:'c2',reason:'Put toys in bins',amount:10,type:'chore',approvedBy:'Parent'},
   {id:uuid(),date:d,time:'7:35 AM',childId:'c2',reason:'Tablet Time Used',amount:-30,type:'redemption',approvedBy:'Parent'},
   {id:uuid(),date:d,time:'7:15 AM',childId:'c3',reason:'Took trash to curb',amount:4,type:'chore',approvedBy:'Parent'},
   {id:uuid(),date:d,time:'7:25 AM',childId:'c3',reason:'Dishwasher responsibility missed',amount:-1,type:'deduction',approvedBy:'Parent'},
   {id:uuid(),date:d,time:'7:45 AM',childId:'c3',reason:'Parent bonus',amount:5,type:'bonus',approvedBy:'Parent'}
  ],
  payments:[{id:'p1',childId:'c3',week:'This week',earned:31,deductions:-5,bonuses:4,total:30,status:'unpaid'}],
  redemptions:[{id:'r1',childId:'c2',amount:30,date:d,status:'approved'}],
  selectedLib:[],
  session:{mode:'family',kidId:null,parentUnlocked:false,parentTab:'home',kidTab:'today'}
 };
}
let db=JSON.parse(localStorage.getItem(DB_KEY)||'null')||seed();
function save(){localStorage.setItem(DB_KEY,JSON.stringify(db))}
function child(id){return db.children.find(x=>x.id===id)}
function chore(id){return db.chores.find(x=>x.id===id)}
function bal(c){
 return db.ledger.filter(t=>t.childId===c.id).reduce((a,t)=>a+t.amount,0)
}
function fmt(c,n){return c.rewardType==='money'?money(n):`${Math.round(n)} min`}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),1700)}
function escapeHtml(s=''){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function statusCounts(c){
 const ins=db.instances.filter(i=>i.childId===c.id&&i.date===todayISO());
 return {done:ins.filter(i=>i.status==='approved').length,pending:ins.filter(i=>i.status==='pending').length,remaining:ins.filter(i=>i.status==='todo').length,total:ins.length}
}
function appShell(content,nav=''){
 return `<div class="topbar"><div class="brand">Family<span>Flow</span></div><div class="spacer"></div>
 <button class="mode-btn ${db.session.mode==='family'?'active':''}" onclick="switchMode('family')">Family</button>
 <button class="mode-btn ${db.session.mode==='kid'?'active':''}" onclick="openKidPicker()">Kid</button>
 <button class="mode-btn ${db.session.mode==='parent'?'active':''}" onclick="enterParent()">Parent</button></div>
 <main>${content}</main>${nav}`;
}
function familyView(){
 const counts=db.children.map(statusCounts);
 const done=counts.reduce((a,x)=>a+x.done,0), rem=counts.reduce((a,x)=>a+x.remaining,0), pend=db.approvals.filter(a=>a.status==='pending').length;
 const pct=(done+rem+pend)?Math.round(done/(done+rem+pend)*100):100;
 const cards=db.children.map(c=>{
  const s=statusCounts(c);
  return `<div class="card kid-card" onclick="loginKid('${c.id}')" style="cursor:pointer">
    <div class="avatar">${c.avatar}</div><div><h3>${c.name} <span class="small muted">Age ${c.age}</span></h3>
    <div class="small muted">${s.done} complete • ${s.remaining} remaining • ${s.pending} pending</div>
    <div class="row" style="margin-top:7px"><span class="tag good">🔥 ${c.streak} day streak</span></div></div>
    <div class="balance">${fmt(c,bal(c))}<div class="small muted">${c.rewardType==='money'?'balance':'tablet time'}</div></div></div>`;
 }).join('');
 return appShell(`
  <div class="hero card"><div class="row between"><div><div class="small muted">TODAY</div><h1>Family progress</h1><p>${pct}% of today’s approved work is complete.</p></div><div class="ring" style="--pct:${pct}"><b>${pct}%</b></div></div><div class="progress" style="margin-top:15px"><i style="width:${pct}%"></i></div></div>
  <div class="grid cols-4" style="margin-top:14px">
   <div class="card stat"><span class="small muted">Completed</span><b>${done}</b></div>
   <div class="card stat"><span class="small muted">Remaining</span><b>${rem}</b></div>
   <div class="card stat"><span class="small muted">Approvals</span><b>${pend}</b></div>
   <div class="card stat"><span class="small muted">Bonus jobs</span><b>${db.chores.filter(c=>c.type==='bonus'&&c.active).length}</b></div>
  </div>
  <div class="section-head"><h2>Kids</h2><span class="tag blue">Tap a profile</span></div>
  <div class="grid cols-3">${cards}</div>
 `);
}
function openKidPicker(){
 const html=db.children.map(c=>`<button class="secondary" style="width:100%;margin:5px 0;text-align:left" onclick="loginKid('${c.id}')"><b>${c.name}</b><br><span class="small muted">${c.rewardType==='money'?'Money':'Tablet minutes'} • PIN required</span></button>`).join('');
 modal(`<h2>Choose a profile</h2><p style="margin-bottom:12px">Each child enters their own 4-digit PIN.</p>${html}`);
}
function loginKid(id){
 const c=child(id);
 modal(`<h2>${c.name}'s PIN</h2><p>Enter the 4-digit kid PIN.</p><input id="kidPin" class="input pin" maxlength="4" inputmode="numeric" placeholder="••••" style="margin:16px 0">
 <button class="primary" style="width:100%" onclick="verifyKid('${id}')">Open ${c.name}'s dashboard</button>`);
 setTimeout(()=>document.getElementById('kidPin')?.focus(),50);
}
function verifyKid(id){
 const v=document.getElementById('kidPin').value;
 if(v===child(id).pin){db.session.mode='kid';db.session.kidId=id;db.session.kidTab='today';save();closeModal();render()}
 else toast('Incorrect PIN');
}
function enterParent(){
 if(db.session.parentUnlocked){db.session.mode='parent';save();render();return}
 modal(`<h2>Parent Mode</h2><p>Enter the secure parent PIN.</p><input id="parentPin" class="input pin" maxlength="4" inputmode="numeric" placeholder="••••" style="margin:16px 0">
 <button class="primary" style="width:100%" onclick="verifyParent()">Unlock Parent Mode</button>
 <div class="notice" style="margin-top:12px">Prototype PIN: <b>2468</b></div>`);
}
function verifyParent(){
 const v=document.getElementById('parentPin').value;
 if(v===db.family.parentPin){db.session.parentUnlocked=true;db.session.mode='parent';save();closeModal();render()}
 else toast('Incorrect parent PIN');
}
function switchMode(m){db.session.mode=m;if(m!=='kid')db.session.kidId=null;save();render()}
function kidNav(){
 const tabs=[['today','☀️','Today'],['rewards','🎁','Rewards'],['jobs','🧰','Jobs'],['progress','📈','Progress']];
 return `<nav class="bottomnav"><div class="navwrap">${tabs.map(t=>`<button class="navitem ${db.session.kidTab===t[0]?'active':''}" onclick="kidTab('${t[0]}')"><span>${t[1]}</span>${t[2]}</button>`).join('')}</div></nav>`;
}
function kidTab(t){db.session.kidTab=t;save();render()}
function kidView(){
 const c=child(db.session.kidId)||db.children[0];
 if(db.session.kidTab==='rewards')return appShell(kidRewards(c),kidNav());
 if(db.session.kidTab==='jobs')return appShell(kidJobs(c),kidNav());
 if(db.session.kidTab==='progress')return appShell(kidProgress(c),kidNav());
 const ins=db.instances.filter(i=>i.childId===c.id&&i.date===todayISO());

function commitChild(){const name=document.getElementById('newName').value.trim();if(!name)return toast('Enter a name');const c={id:uuid(),name,age:Number(document.getElementById('newAge').value||5),rewardType:document.getElementById('newReward').value,pin:document.getElementById('newPin').value||'0000',streak:0,avatar:name[0].toUpperCase(),weeklyPct:0,badges:[]};db.children.push(c);save();closeModal();toast('Child added');render()}
function adjustBalance(id){
 const c=child(id);modal(`<h2>Adjust ${c.name}'s balance</h2><p>Positive adds value; negative subtracts it. This creates a permanent ledger entry.</p><label style="display:block;margin-top:14px">Amount (${c.rewardType==='money'?'dollars':'minutes'})<input id="adjAmount" class="input" type="number" step="${c.rewardType==='money'?'.5':'5'}"></label><label style="display:block;margin-top:12px">Reason<input id="adjReason" class="input" placeholder="Parent adjustment"></label><button class="primary" style="width:100%;margin-top:14px" onclick="commitAdjust('${id}')">Save adjustment</button>`);
}
function commitAdjust(id){addLedger(id,Number(document.getElementById('adjAmount').value||0),document.getElementById('adjReason').value||'Parent adjustment','adjustment','Parent');save();closeModal();toast('Ledger updated');render()}
function parentReports(){
 const total=db.instances.length,approved=db.instances.filter(i=>i.status==='approved').length,pending=db.instances.filter(i=>i.status==='pending').length,missed=1;
 const rewards=db.ledger.filter(t=>t.amount>0).reduce((a,t)=>a+t.amount,0), deductions=db.ledger.filter(t=>t.amount<0&&t.type==='deduction').reduce((a,t)=>a+Math.abs(t.amount),0);
 return `<h1>Reports</h1><p>Filter-ready reporting foundation with family, child, chore, category and reward data.</p><div class="toolbar" style="margin-top:16px"><select class="select"><option>All children</option>${db.children.map(c=>`<option>${c.name}</option>`).join('')}</select><select class="select"><option>This week</option><option>This month</option><option>Today</option></select><select class="select"><option>All categories</option>${[...new Set(db.chores.map(c=>c.category))].map(x=>`<option>${x}</option>`).join('')}</select></div>
 <div class="grid cols-4" style="margin-top:13px"><div class="card stat"><span class="small muted">Completed</span><b>${approved}</b></div><div class="card stat"><span class="small muted">Pending</span><b>${pending}</b></div><div class="card stat"><span class="small muted">Missed</span><b>${missed}</b></div><div class="card stat"><span class="small muted">Completion</span><b>${total?Math.round(approved/total*100):0}%</b></div></div>
 <div class="section-head"><h2>Completion by child</h2></div><div class="card">${db.children.map(c=>{const s=statusCounts(c),p=s.total?Math.round(s.done/s.total*100):0;return `<div style="margin:13px 0"><div class="row between"><b>${c.name}</b><span>${p}%</span></div><div class="progress" style="margin-top:6px"><i style="width:${p}%"></i></div></div>`}).join('')}</div>
 <div class="section-head"><h2>Ledger activity</h2></div><div class="card"><table class="table"><thead><tr><th>Child</th><th>Reason</th><th>Type</th><th>Amount</th></tr></thead><tbody>${db.ledger.slice(0,20).map(t=>{const c=child(t.childId);return `<tr><td>${c.name}</td><td>${escapeHtml(t.reason)}</td><td>${t.type}</td><td class="${t.amount>=0?'ledger-pos':'ledger-neg'}">${t.amount>=0?'+':''}${fmt(c,t.amount)}</td></tr>`}).join('')}</tbody></table></div>`;
}
function parentSettings(){
 return `<h1>Settings</h1><p>Family defaults and controls.</p>
 <div class="grid cols-2" style="margin-top:16px"><div class="card"><h3>Tablet time</h3><div class="formgrid" style="margin-top:12px"><label>Daily maximum<input id="setLimit" class="input" type="number" value="${db.family.settings.dailyTabletLimit}"></label><label>Minimum redemption<input id="setMin" class="input" type="number" value="${db.family.settings.minRedemption}"></label></div></div><div class="card"><h3>Suggested tablet rewards</h3><div class="formgrid" style="margin-top:12px"><label>Small<input id="setSm" class="input" type="number" value="${db.family.settings.smallMinutes}"></label><label>Medium<input id="setMm" class="input" type="number" value="${db.family.settings.mediumMinutes}"></label><label>Large<input id="setLm" class="input" type="number" value="${db.family.settings.largeMinutes}"></label></div></div><div class="card"><h3>Suggested money rewards</h3><div class="formgrid" style="margin-top:12px"><label>Small<input id="setSd" class="input" type="number" step=".5" value="${db.family.settings.smallMoney}"></label><label>Medium<input id="setMd" class="input" type="number" step=".5" value="${db.family.settings.mediumMoney}"></label><label>Large<input id="setLd" class="input" type="number" step=".5" value="${db.family.settings.largeMoney}"></label></div></div><div class="card"><h3>Prototype data</h3><p style="margin:8px 0 12px">Reset all local data back to the seeded three-child demo.</p><button class="secondary danger" onclick="resetData()">Reset demo</button></div></div>
 <button class="primary" style="margin-top:14px" onclick="saveSettings()">Save settings</button>
 <div class="section-head"><h2>Teen weekly settlement</h2></div>${db.children.filter(c=>c.rewardType==='money').map(c=>parentSettlement(c)).join('')}`;
}
function parentSettlement(c){
 const p=db.payments.find(x=>x.childId===c.id&&x.status==='unpaid');
 if(!p)return `<div class="card"><b>${c.name}</b><p>No unpaid settlement.</p></div>`;
 return `<div class="card"><div class="row between"><div><h3>${c.name}</h3><div class="small muted">Earned ${money(p.earned)} • Deductions ${money(p.deductions)} • Bonuses ${money(p.bonuses)}</div><div style="font-size:30px;font-weight:900;margin-top:6px">${money(p.total)} owed</div></div><button class="primary success" onclick="markPaid('${p.id}')">MARK PAID</button></div></div>`;
}
function markPaid(id){const p=db.payments.find(x=>x.id===id);if(!p)return;p.status='paid';addLedger(p.childId,-Math.abs(p.total),'Weekly payout paid','payment','Parent');save();toast('Payment marked paid and balance cleared by ledger entry');render()}
function saveSettings(){Object.assign(db.family.settings,{dailyTabletLimit:Number(setLimit.value),minRedemption:Number(setMin.value),smallMinutes:Number(setSm.value),mediumMinutes:Number(setMm.value),largeMinutes:Number(setLm.value),smallMoney:Number(setSd.value),mediumMoney:Number(setMd.value),largeMoney:Number(setLd.value)});save();toast('Settings saved')}
function resetData(){localStorage.removeItem(DB_KEY);db=seed();save();toast('Demo reset');render()}
function modal(html){closeModal();const d=document.createElement('div');d.id='modalBack';d.className='modalback';d.innerHTML=`<div class="modal"><div class="row between" style="margin-bottom:8px"><div></div><button class="icon-btn" onclick="closeModal()">✕</button></div>${html}</div>`;d.onclick=e=>{if(e.target===d)closeModal()};document.body.appendChild(d)}
function closeModal(){document.getElementById('modalBack')?.remove()}
function render(){
 const root=document.getElementById('app');
 root.innerHTML=db.session.mode==='kid'&&db.session.kidId?kidView():db.session.mode==='parent'&&db.session.parentUnlocked?parentView():familyView();
}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
render();
</script>
</body>
</html>
