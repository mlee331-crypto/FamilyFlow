<style>

00;font-size:20px}.balance{font-weight:900;font-size:20px;text-align:right}.tag{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:6px 9px;background:#f0f3f7;color:#475467;font-size:12px;font-weight:800}.tag.good{background:#eaf8ef;color:var(--good)}.tag.warn{background:#fff3e7;color:var(--warn)}.tag.bad{background:#ffefed;color:var(--bad)}.tag.blue{background:#edf4ff;color:var(--accent)}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 0 10px}.task{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}.task:first-child{border-top:0;padding-top:0}.task-title{font-weight:850;margin-bottom:5px}.reward{font-weight:900;color:var(--good)}.done-btn,.primary{border:0;border-radius:15px;background:var(--accent);color:#fff;font-weight:850;padding:12px 16px;min-height:46px}.secondary{border:1px solid var(--line);border-radius:15px;background:#fff;color:var(--ink);font-weight:800;padding:11px 14px;min-height:44px}.danger{border-color:#f5c2bd;color:var(--bad);background:#fff6f5}.success{background:var(--good)}.reject{background:#fff;color:var(--bad);border:1px solid #f0b9b5}.pending{background:#fff7ed;border:1px solid #fed7aa}.big-balance{font-size:42px;font-weight:950;letter-spacing:-.05em;margin:4px 0}.bottomnav{position:fixed;z-index:30;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:7px 8px calc(7px + env(safe-area-inset-bottom));display:flex;justify-content:center}.bottomnav .navwrap{width:min(100%,900px);display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}.navitem{border:0;background:transparent;border-radius:12px;padding:8px 5px;color:#667085;font-weight:800;font-size:11px}.navitem span{display:block;font-size:19px;margin-bottom:2px}.navitem.active{background:#edf4ff;color:var(--accent)}.toolbar{display:grid;grid-template-columns:1fr auto auto;gap:8px}.search,.select,.input{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 13px;outline:none}.library{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.libcard{border:1px solid var(--line);border-radius:17px;padding:14px;background:#fff}.modalback{position:fixed;z-index:100;inset:0;background:rgba(17,24,39,.45);display:grid;place-items:end center}.modal{width:min(100%,650px);max-height:90vh;overflow:auto;background:#fff;border-radius:26px 26px 0 0;padding:20px 18px calc(28px + env(safe-area-inset-bottom));box-shadow:0 -15px 60px rgba(0,0,0,.2)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-size:12px;font-weight:800;color:#475467}label input,label select{margin-top:6px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.row.between{justify-content:space-between}.divider{height:1px;background:var(--line);margin:15px 0}.empty{padding:28px;text-align:center;color:var(--muted)}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line);font-size:13px}.table th{color:#667085;font-size:11px;text-transform:uppercase;letter-spacing:.05em}.ledger-pos{color:var(--good);font-weight:900}.ledger-neg{color:var(--bad);font-weight:900}.login{max-width:460px;margin:8vh auto 0}.pin{font-size:26px;letter-spacing:.32em;text-align:center;font-weight:900}.notice{border-radius:14px;padding:11px 12px;background:#eef5ff;color:#264c87;font-size:13px}.error{background:#fff0ef;color:#9b1c13}.toast{position:fixed;z-index:200;left:50%;bottom:95px;transform:translateX(-50%);background:#111827;color:#fff;border-radius:99px;padding:10px 15px;font-weight:800;font-size:13px;box-shadow:var(--shadow)}.spinner{width:34px;height:34px;border:4px solid #dce6f7;border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:20vh auto}@keyframes spin{to{transform:rotate(360deg)}}

@keyframes thumbDrop{0%{transform:translateY(-30px) scale(.5);opacity:0}100%{transform:translateY(0) scale(1);opacity:1}}
.reject-list{text-align:left;margin:16px 0;background:#fff4f2;border:1px solid #ffd7d2;border-radius:16px;padding:12px 14px}

@media(max-width:430px){main{padding-left:12px;padding-right:12px}.card{padding:14px;border-radius:18px}.kid-card{grid-template-columns:auto 1fr}.kid-card .balance{grid-column:1/-1;text-align:left}.formgrid{grid-template-columns:1fr}}

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL='https://dxzgpcquvwjacnxjjumg.supabase.co';
const SUPABASE_KEY='sb_publishable_wLnZ8wQlzFzKVjr95mEziA_KePU101A';
const sb=createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(n||0));
const fmtUnit=(unit,n)=>unit==='money'?money(n):`${Math.round(Number(n||0))} min`;
const fmt=(child,n,unit)=>fmtUnit(unit||(child?.reward_type==='money'?'money':'minutes'),n);
const rewardModeLabel=mode=>mode==='both'?'Money + screen time':mode==='money'?'Money':'Screen time';
const state={session:null,user:null,family:null,settings:null,hasParentPin:true,children:[],allChildren:[],balances:{},moneyBalances:{},minuteBalances:{},chores:[],assignments:[],completions:[],ledger:[],redemptions:[],library:[],badges:[],streaks:[],view:'family',kidId:null,parentUnlocked:false,parentTab:'home',kidTab:'today',loading:true,librarySearch:'',recovery:(location.hash.includes('type=recovery')||location.search.includes('type=recovery'))};

function toast(msg){document.querySelector('.toast')?.remove();const d=document.createElement('div');d.className='toast';d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}

let funAudioCtx=null;
function ensureFunAudio(){
 try{
  if(!funAudioCtx)funAudioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(funAudioCtx.state==='suspended')funAudioCtx.resume();
 }catch(e){}
 return funAudioCtx;
}
function tone(ctx,freq,start,duration,type='sine',volume=.055){
 const o=ctx.createOscillator(),g=ctx.createGain();
 o.type=type;o.frequency.setValueAtTime(freq,start);
 g.gain.setValueAtTime(.0001,start);g.gain.exponentialRampToValueAtTime(volume,start+.018);
 g.gain.exponentialRampToValueAtTime(.0001,start+duration);
 o.connect(g).connect(ctx.destination);o.start(start);o.stop(start+duration+.02);
}
function playCheerSound(){
 const ctx=ensureFunAudio();if(!ctx)return;
 const t=ctx.currentTime+.03;
 // Original retro 8-bit victory jingle: bright, bouncy, arcade-platform feel.
 const melody=[
  [659.25,0,.10],[783.99,.11,.10],[987.77,.22,.12],[1318.51,.35,.18],
  [987.77,.58,.09],[1174.66,.68,.09],[1318.51,.78,.14],[1567.98,.94,.19],
  [1318.51,1.19,.10],[1567.98,1.30,.10],[1975.53,1.41,.14],[2093.00,1.58,.22],
  [1567.98,1.88,.10],[1760.00,1.99,.10],[2093.00,2.10,.14],[2637.02,2.28,.38]
 ];
 melody.forEach(([f,off,dur])=>tone(ctx,f,t+off,dur,'square',.032));
 const bass=[
  [164.81,.00,.18],[196.00,.35,.18],[246.94,.78,.18],[261.63,1.19,.18],
  [329.63,1.58,.18],[392.00,2.10,.18],[523.25,2.28,.45]
 ];
 bass.forEach(([f,off,dur])=>tone(ctx,f,t+off,dur,'triangle',.022));
 // Small noise "sparkle" at the end, generated locally in the browser.
 try{
  const start=t+2.34,len=Math.floor(ctx.sampleRate*.34),buf=ctx.createBuffer(1,len,ctx.sampleRate),data=buf.getChannelData(0);
  for(let i=0;i<len;i++)data[i]=(Math.random()*2-1)*(1-i/len);
  const src=ctx.createBufferSource(),gain=ctx.createGain(),filter=ctx.createBiquadFilter();
  filter.type='highpass';filter.frequency.value=2100;
  gain.gain.setValueAtTime(.0001,start);gain.gain.linearRampToValueAtTime(.018,start+.025);gain.gain.exponentialRampToValueAtTime(.0001,start+.32);
  src.buffer=buf;src.connect(filter).connect(gain).connect(ctx.destination);src.start(start);src.stop(start+.34);
 }catch(e){}
}
function playRejectedSound(){
 const ctx=ensureFunAudio();if(!ctx)return;
 const t=ctx.currentTime+.02;
 [392,330,262,196,147].forEach((f,i)=>tone(ctx,f,t+i*.115,.15,'square',.035));
}
function confettiBurst(){
 if(window.matchMedia?.('(prefers-reduced-motion: reduce)').matches)return;
 const count=86,cx=innerWidth/2,cy=Math.min(innerHeight*.42,380);
 for(let i=0;i<count;i++){
  const p=document.createElement('div');p.className='confetti-bit';
  p.style.left=cx+'px';p.style.top=cy+'px';p.style.background=`hsl(${Math.floor(Math.random()*360)} 85% 56%)`;
  document.body.appendChild(p);
  const angle=Math.random()*Math.PI*2,speed=120+Math.random()*340;
  const dx=Math.cos(angle)*speed,dy=Math.sin(angle)*speed+180+Math.random()*220,rot=(Math.random()*1000-500);
  const a=p.animate([
   {transform:'translate(-50%,-50%) scale(.4) rotate(0deg)',opacity:1},
   {transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(1) rotate(${rot}deg)`,opacity:0}
  ],{duration:900+Math.random()*800,easing:'cubic-bezier(.12,.65,.25,1)',fill:'forwards'});
  a.onfinish=()=>p.remove();
 }
}
function celebrateChore(choreId){
 playCheerSound();confettiBurst();
 setTimeout(confettiBurst,900);
 const ch=chore(choreId),d=document.createElement('div');d.className='fun-pop';
 d.innerHTML=`<div class="fun-pop-card">🎉 GREAT JOB! 🎉${ch?.name?`<div style="font-size:15px;font-weight:800;margin-top:8px;opacity:.9">${esc(ch.name)}</div>`:''}<div style="font-size:13px;font-weight:750;margin-top:8px;opacity:.78">Nice work — sent to a parent for approval!</div></div>`;
 document.body.appendChild(d);setTimeout(()=>d.remove(),3500);
}
function showRejectedNotice(childId){
 const unseen=state.completions.filter(x=>x.child_id===childId&&x.status==='rejected'&&!x.kid_notified_at);
 if(!unseen.length)return;
 playRejectedSound();
 const ids=unseen.map(x=>x.id),d=document.createElement('div');d.id='rejectNotice';d.className='reject-notice';
 const names=unseen.map(x=>`<div class="reject-item">👎 ${esc(chore(x.chore_id)?.name||'Chore')}</div>`).join('');
 d.innerHTML=`<div class="reject-card"><div class="reject-thumb">👎</div><h2 style="font-size:27px;margin-bottom:7px">Almost — try again!</h2><p>${unseen.length===1?'This chore was sent back by a parent.':'These chores were sent back by a parent.'}</p><div class="reject-list">${names}</div><button class="primary" style="width:100%" onclick='dismissRejectedNotice(${JSON.stringify(ids)})'>Got it — I’ll try again</button></div>`;
 document.body.appendChild(d);
}
async function dismissRejectedNotice(ids){
 document.getElementById('rejectNotice')?.remove();
 const now=new Date().toISOString();
 state.completions.forEach(x=>{if(ids.includes(x.id))x.kid_notified_at=now});
 const {error}=await sb.from('chore_completions').update({kid_notified_at:now}).in('id',ids);
 if(error)console.warn('Could not mark rejection notice seen',error);
}

function errText(e){return e?.message||String(e||'Something went wrong')}
function modal(html){closeModal();const d=document.createElement('div');d.id='modalBack';d.className='modalback';d.innerHTML=`<div class="modal"><div class="row between" style="margin-bottom:8px"><div></div><button class="icon-btn" onclick="closeModal()">✕</button></div>${html}</div>`;d.onclick=e=>{if(e.target===d)closeModal()};document.body.appendChild(d)}
function closeModal(){document.getElementById('modalBack')?.remove()}
function child(id){return (state.allChildren||state.children).find(c=>c.id===id)}
function chore(id){return state.chores.find(c=>c.id===id)}
function completionFor(choreId,childId){return state.completions.find(x=>x.chore_id===choreId&&x.child_id===childId&&x.due_date===today())}
function balance(id,unit){if(unit==='money')return Number(state.moneyBalances[id]||0);if(unit==='minutes')return Number(state.minuteBalances[id]||0);return Number(state.balances[id]||0)}
function balanceSummary(c){if(!c)return '';if(c.reward_type==='both')return `${money(balance(c.id,'money'))} • ${Math.round(balance(c.id,'minutes'))} min`;return c.reward_type==='money'?money(balance(c.id,'money')):`${Math.round(balance(c.id,'minutes'))} min`}
function rewardUnitFor(ch,c){return ch?.reward_unit||(c?.reward_type==='money'?'money':'minutes')}
function rewardOptions(c){if(!c)return '<option value="minutes">Screen time</option>';if(c.reward_type==='both')return '<option value="minutes">Screen time (minutes)</option><option value="money">Money ($)</option>';if(c.reward_type==='money')return '<option value="money">Money ($)</option>';return '<option value="minutes">Screen time (minutes)</option>'}
function pendingCount(){return state.completions.filter(x=>x.status==='pending').length+state.redemptions.filter(x=>x.status==='pending').length}

async function init(){
 sb.auth.onAuthStateChange(async(event,s)=>{
   state.session=s;state.user=s?.user||null;
   if(event==='PASSWORD_RECOVERY'){state.recovery=true;state.loading=false;render();return}
   if(s){if(!state.recovery)await loadData();else{state.loading=false;render()}}
   else{resetState();render()}
 });
 const {data:{session}}=await sb.auth.getSession();state.session=session;state.user=session?.user||null;
 if(state.recovery&&session){state.loading=false;render();return}
 if(session)await loadData();else{state.loading=false;render()}
}
function resetState(){Object.assign(state,{family:null,settings:null,hasParentPin:true,children:[],allChildren:[],balances:{},moneyBalances:{},minuteBalances:{},chores:[],assignments:[],completions:[],ledger:[],redemptions:[],library:[],badges:[],streaks:[],view:'family',kidId:null,parentUnlocked:false,loading:false})}

async function loadData(){
 state.loading=true;render();
 try{
  const {data:fams,error:fe}=await sb.from('families').select('id,name,owner_user_id,created_at').order('created_at',{ascending:true}).limit(1);if(fe)throw fe;
  state.family=fams?.[0]||null;
  if(!state.family){state.loading=false;render();return}
  const fid=state.family.id;
  const {error:allowanceError}=await sb.rpc('ensure_weekly_allowances',{target_family:fid});if(allowanceError)console.warn('Weekly allowance sync',allowanceError);
  const [settingsR,pinStatusR,childrenR,balancesR,choresR,assignR,libraryR,badgesR,streaksR]=await Promise.all([
   sb.from('family_settings').select('family_id,tablet_daily_limit,tablet_min_redemption,updated_at').eq('family_id',fid).maybeSingle(),
   sb.rpc('has_parent_pin',{target_family:fid}),
   sb.from('children').select('id,family_id,name,age,reward_type,weekly_screen_minutes,weekly_money_allowance,avatar,active,created_at').eq('family_id',fid).order('created_at'),
   sb.from('child_balances').select('child_id,balance,money_balance,minutes_balance,reward_type').eq('family_id',fid),
   sb.from('chores').select('*').eq('family_id',fid).order('created_at'),
   sb.from('chore_assignments').select('*').eq('family_id',fid),
   sb.from('chore_library').select('id,name,category,min_age,max_age,suggested_frequency,difficulty,suggested_type,popular_score').eq('active',true).order('popular_score',{ascending:false}).limit(250),
   sb.from('badges').select('*').eq('family_id',fid).order('awarded_at',{ascending:false}),
   sb.from('streaks').select('*').eq('family_id',fid)
  ]);
  for(const r of [settingsR,pinStatusR,childrenR,balancesR,choresR,assignR,libraryR,badgesR,streaksR])if(r.error)throw r.error;
  state.settings=settingsR.data||{};state.hasParentPin=!!pinStatusR.data;state.allChildren=childrenR.data||[];state.children=state.allChildren.filter(c=>c.active);state.chores=choresR.data||[];state.assignments=assignR.data||[];state.library=libraryR.data||[];state.badges=badgesR.data||[];state.streaks=streaksR.data||[];
  state.balances={};state.moneyBalances={};state.minuteBalances={};for(const b of balancesR.data||[]){state.balances[b.child_id]=Number(b.balance||0);state.moneyBalances[b.child_id]=Number(b.money_balance||0);state.minuteBalances[b.child_id]=Number(b.minutes_balance||0)}
  await ensureTodayCompletions();
  const [compR,ledgerR,redR]=await Promise.all([
   sb.from('chore_completions').select('*').eq('family_id',fid).gte('due_date',new Date(Date.now()-14*86400000).toISOString().slice(0,10)).order('due_date',{ascending:false}),
   sb.from('reward_transactions').select('*').eq('family_id',fid).order('created_at',{ascending:false}).limit(150),
   sb.from('tablet_redemptions').select('*').eq('family_id',fid).order('requested_at',{ascending:false}).limit(100)
  ]);
  for(const r of [compR,ledgerR,redR])if(r.error)throw r.error;
  state.completions=compR.data||[];state.ledger=ledgerR.data||[];state.redemptions=redR.data||[];
 }catch(e){console.error(e);toast(errText(e))}
 state.loading=false;render();
}

async function ensureTodayCompletions(){
 if(!state.family)return;
 const rows=[];
 for(const a of state.assignments){const ch=state.chores.find(x=>x.id===a.chore_id),kid=state.children.find(x=>x.id===a.child_id);if(!ch||!ch.active||!kid||ch.chore_type==='bonus')continue;rows.push({family_id:state.family.id,chore_id:a.chore_id,child_id:a.child_id,due_date:today(),status:'todo'})}

async function signIn(){const email=$('email').value.trim(),password=$('password').value;const {error}=await sb.auth.signInWithPassword({email,password});if(error)toast(errText(error))}
function forgotPassword(){
 const current=$('email')?.value?.trim()||'';
 modal(`<h2>Forgot password?</h2><p>Enter the email used for FamilyFlow. We’ll send a secure reset link.</p><label style="display:block;margin-top:16px">Email<input id="resetEmail" class="input" type="email" autocomplete="email" value="${esc(current)}" placeholder="you@example.com"></label><button class="primary" style="width:100%;margin-top:14px" onclick="sendPasswordReset()">Send reset email</button>`);
}
async function sendPasswordReset(){
 const email=$('resetEmail').value.trim();
 if(!email)return toast('Enter your email');
 const last=Number(localStorage.getItem('familyflow-reset-request-at')||0);
 const wait=Math.ceil((90000-(Date.now()-last))/1000);
 if(wait>0)return toast(`Please wait ${wait}s before requesting another reset email`);
 const btn=document.querySelector('#modalBack .primary');
 if(btn){btn.disabled=true;btn.textContent='Sending…'}
 const redirectTo=location.origin+location.pathname;
 const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo});
 if(error){
   if(btn){btn.disabled=false;btn.textContent='Send reset email'}
   const m=(error.message||'').toLowerCase();
   if(m.includes('rate limit'))return toast('Supabase email limit reached. Wait a bit, then request one new email.');
   return toast(errText(error));
 }
 localStorage.setItem('familyflow-reset-request-at',String(Date.now()));
 closeModal();toast('Reset email sent — use the newest email only');
}
function recoveryView(){return `<main><div class="login card"><div class="brand">Family<span>Flow</span></div><h1 style="margin-top:18px">Choose a new password</h1><p>Enter a new password for your FamilyFlow parent account.</p><label style="display:block;margin-top:18px">New password<input id="newPassword" class="input" type="password" autocomplete="new-password" placeholder="At least 6 characters"></label><label style="display:block;margin-top:12px">Confirm password<input id="confirmPassword" class="input" type="password" autocomplete="new-password" placeholder="Repeat password"></label><button class="primary" style="width:100%;margin-top:16px" onclick="saveNewPassword()">Update password</button></div></main>`}

 if(p!==c)return toast('Passwords do not match');

 await loadData();
}

function familyView(){
 const cards=state.children.map(c=>{const todays=state.completions.filter(x=>x.child_id===c.id&&x.due_date===today());const done=todays.filter(x=>x.status==='approved').length;const pct=todays.length?Math.round(done/todays.length*100):0;const streak=state.streaks.find(s=>s.child_id===c.id)?.current_daily||0;return `<button class="card kid-card" style="text-align:left;width:100%" onclick="kidPin('${c.id}')"><div class="avatar">${esc(c.avatar||c.name[0])}</div><div><h3>${esc(c.name)}</h3><div class="small muted">${done}/${todays.length} approved today • 🔥 ${streak} day streak</div><div class="progress" style="margin-top:8px"><i style="width:${pct}%"></i></div></div><div class="balance">${balanceSummary(c)}</div></button>`}).join('');

function kidPin(id){const c=child(id);modal(`<h2>${esc(c.name)}</h2><p>Enter ${esc(c.name)}'s 4-digit PIN.</p><label style="display:block;margin-top:16px">PIN<input id="kidPinInput" class="input pin" inputmode="numeric" maxlength="4" type="password"></label><button class="primary" style="width:100%;margin-top:14px" onclick="verifyKid('${id}')">Open Kid Mode</button>`);setTimeout(()=>$('kidPinInput')?.focus(),100)}
async function verifyKid(id){ensureFunAudio();const pin=$('kidPinInput').value.trim();const {data,error}=await sb.rpc('verify_child_pin',{child:id,candidate_pin:pin});if(error)return toast(errText(error));if(!data)return toast('Wrong PIN');closeModal();state.kidId=id;state.view='kid';state.kidTab='today';render();setTimeout(()=>showRejectedNotice(id),120)}

function kidToday(c){const rows=state.assignments.filter(a=>a.child_id===c.id).map(a=>chore(a.chore_id)).filter(ch=>ch&&ch.active&&ch.chore_type!=='bonus');if(!rows.length)return `<div class="section-head"><h2>Today</h2></div><div class="card empty">Nothing assigned today 🎉</div>`;return `<div class="section-head"><h2>Today</h2></div><div class="card">${rows.map(ch=>{const comp=completionFor(ch.id,c.id);const st=comp?.status||'todo';const reward=Number(ch.reward_amount||0),unit=rewardUnitFor(ch,c);return `<div class="task"><div><div class="task-title">${esc(ch.name)}</div><div class="row"><span class="tag ${st==='approved'?'good':st==='pending'?'warn':(st==='missed'||st==='rejected')?'bad':'blue'}">${st==='todo'?'TO DO':st.toUpperCase()}</span>${reward?`<span class="reward">+${fmt(c,reward,unit)}</span>`:''}${ch.due_time?`<span class="small muted">Due ${esc(ch.due_time)}</span>`:''}${st==='rejected'?`<span class="small" style="color:var(--bad);font-weight:800">Parent said try again</span>`:''}</div></div>${st==='todo'?`<button class="done-btn" onclick="markDone('${comp?.id||''}','${ch.id}','${c.id}')">DONE</button>`:st==='rejected'?`<button class="done-btn" onclick="markDone('${comp?.id||''}','${ch.id}','${c.id}')">TRY AGAIN</button>`:st==='pending'?`<span class="tag warn">Waiting for parent</span>`:st==='approved'?`<span class="tag good">✓ Approved</span>`:`<span class="tag">${esc(st)}</span>`}</div>`}).join('')}</div>`}

async function markDone(compId,choreId,childId){ensureFunAudio();try{let id=compId;if(!id){const {data,error}=await sb.from('chore_completions').insert({family_id:state.family.id,chore_id:choreId,child_id:childId,due_date:today(),status:'pending',submitted_at:new Date().toISOString(),kid_notified_at:null}).select('id').single();if(error)throw error;id=data.id}else{const {error}=await sb.from('chore_completions').update({status:'pending',submitted_at:new Date().toISOString(),reviewed_at:null,reviewed_by:null,kid_notified_at:null}).eq('id',id);if(error)throw error}celebrateChore(choreId);toast('Nice! Sent to parent 🚀');await loadData();state.view='kid';state.kidId=childId;state.kidTab='today'}catch(e){toast(errText(e))}}
function kidRewards(c){
 const reqs=state.redemptions.filter(r=>r.child_id===c.id).slice(0,8);
 const screen=c.reward_type==='minutes'||c.reward_type==='both'?`<div class="card"><div class="small muted">Screen time available this week</div><div class="big-balance">${Math.round(balance(c.id,'minutes'))} min</div>${Number(c.weekly_screen_minutes||0)>0?`<p>Includes ${Math.round(Number(c.weekly_screen_minutes||0)/60*10)/10} hr weekly allowance. Screen-time balance resets each Monday.</p>`:`<p>Earn or receive screen time from a parent. Screen-time balance resets each Monday.</p>`}<div class="row" style="margin-top:14px">${[15,30,60].map(n=>`<button class="secondary" onclick="requestMinutes(${n})">Use ${n} min</button>`).join('')}</div></div>`:'';
 const cash=c.reward_type==='money'||c.reward_type==='both'?`<div class="card"><div class="small muted">Money balance</div><div class="big-balance">${money(balance(c.id,'money'))}</div>${Number(c.weekly_money_allowance||0)>0?`<p>${money(c.weekly_money_allowance)} is added each week.</p>`:`<p>Money carries forward until a parent settles it.</p>`}</div>`:'';
 return `<div class="section-head"><h2>Rewards</h2></div><div class="grid cols-2">${screen}${cash}</div>${reqs.length?`<div class="section-head"><h2>Recent screen-time requests</h2></div><div class="card">${reqs.map(r=>`<div class="row between" style="padding:9px 0;border-bottom:1px solid var(--line)"><span>${r.minutes} min</span><span class="tag ${r.status==='approved'?'good':r.status==='pending'?'warn':'bad'}">${esc(r.status)}</span></div>`).join('')}</div>`:''}`}

function kidJobs(c){const jobs=state.assignments.filter(a=>a.child_id===c.id).map(a=>chore(a.chore_id)).filter(ch=>ch&&ch.active&&ch.chore_type==='bonus');return `<div class="section-head"><h2>Bonus Jobs</h2></div>${jobs.length?`<div class="grid">${jobs.map(ch=>`<div class="card"><div class="row between"><div><h3>${esc(ch.name)}</h3><div class="reward" style="margin-top:6px">+${fmt(c,ch.reward_amount,rewardUnitFor(ch,c))}</div></div><button class="primary" onclick="claimBonus('${ch.id}','${c.id}')">Claim job</button></div></div>`).join('')}</div>`:`<div class="card empty">No bonus jobs available.</div>`}`}

function kidProgress(c){const streak=state.streaks.find(s=>s.child_id===c.id);const badges=state.badges.filter(b=>b.child_id===c.id);const recent=state.ledger.filter(t=>t.child_id===c.id).slice(0,10);return `<div class="section-head"><h2>Progress</h2></div><div class="grid cols-2"><div class="card stat"><span class="small muted">Current streak</span><b>🔥 ${streak?.current_daily||0} days</b></div><div class="card stat"><span class="small muted">Best streak</span><b>${streak?.longest_daily||0} days</b></div></div><div class="section-head"><h2>Badges</h2></div><div class="card">${badges.length?badges.map(b=>`<div class="row" style="padding:9px 0"><span style="font-size:24px">🏅</span><b>${esc(b.badge_name)}</b></div>`).join(''):`<div class="empty">Complete chores to earn badges.</div>`}</div><div class="section-head"><h2>Recent activity</h2></div><div class="card">${recent.length?recent.map(t=>`<div class="row between" style="padding:9px 0;border-bottom:1px solid var(--line)"><span>${esc(t.reason)}</span><b class="${Number(t.amount)>=0?'ledger-pos':'ledger-neg'}">${Number(t.amount)>=0?'+':''}${fmt(c,t.amount)}</b></div>`).join(''):`<div class="empty">No activity yet.</div>`}</div>`}

async function approveRedemption(id){const {error}=await sb.rpc('approve_tablet_redemption',{target_redemption:id});if(error)return toast(errText(error));toast('Tablet time approved — balance deducted');await loadData();state.view='parent';state.parentUnlocked=true;state.parentTab='approvals'}
async function rejectRedemption(id){const {error}=await sb.rpc('reject_tablet_redemption',{target_redemption:id});if(error)return toast(errText(error));toast('Request rejected');await loadData();state.view='parent';state.parentUnlocked=true;state.parentTab='approvals'}

function parentKids(){return `<div class="row between"><div><h1>Kids</h1><p>Manage PINs, reward types, weekly allowances, and balances.</p></div><button class="primary" onclick="addChildModal()">+ Add child</button></div><div class="grid cols-3" style="margin-top:15px">${state.children.map(c=>`<div class="card"><div class="row"><div class="avatar">${esc(c.avatar||c.name[0])}</div><div><h3>${esc(c.name)}</h3><div class="small muted">Age ${c.age} • ${rewardModeLabel(c.reward_type)}</div></div></div><div class="big-balance" style="font-size:27px">${balanceSummary(c)}</div><div class="row"><button class="primary" onclick="adjustRewardModal('${c.id}')">+ Add reward</button><button class="secondary" onclick="rewardSettingsModal('${c.id}')">Reward settings</button><button class="secondary" onclick="resetKidPin('${c.id}')">Reset PIN</button></div></div>`).join('')}</div>`}

function addChildModal(){modal(`<h2>Add child</h2><div class="formgrid"><label>Name<input id="newChildName" class="input"></label><label>Age<input id="newChildAge" class="input" type="number" min="3" max="18" value="6"></label><label>Reward type<select id="newChildReward" class="input"><option value="minutes">Screen time</option><option value="money">Money</option><option value="both">Money + screen time</option></select></label><label>4-digit PIN<input id="newChildPin" class="input pin" inputmode="numeric" maxlength="4" type="password"></label><label>Weekly screen-time hours<input id="newChildWeeklyScreen" class="input" type="number" min="0" step="0.5" value="0"></label><label>Weekly money allowance<input id="newChildWeeklyMoney" class="input" type="number" min="0" step="0.25" value="0"></label></div><p class="small muted" style="margin-top:10px">Example: enter 5 for a 5-hour weekly screen-time allowance. You can change this later.</p><button class="primary" style="width:100%;margin-top:14px" onclick="addChild()">Add child</button>`)}

async function addChild(){const returnTab=state.parentTab==='settings'?'settings':'kids',name=$('newChildName').value.trim(),age=Number($('newChildAge').value),reward=$('newChildReward').value,pin=$('newChildPin').value.trim(),weeklyScreen=Math.round(Number($('newChildWeeklyScreen').value||0)*60),weeklyMoney=Number($('newChildWeeklyMoney').value||0);const {data,error}=await sb.rpc('create_child',{target_family:state.family.id,child_name:name,child_age:age,child_reward_type:reward,child_pin:pin,child_avatar:name?name[0].toUpperCase():null});if(error)return toast(errText(error));const {error:re}=await sb.rpc('update_child_rewards',{target_child:data,reward_mode:reward,weekly_screen:weeklyScreen,weekly_money:weeklyMoney});if(re)return toast(errText(re));closeModal();toast('Child added');await loadData();state.view='parent';state.parentUnlocked=true;state.parentTab=returnTab;render()}

function rewardSettingsModal(id){const c=child(id);if(!c)return;modal(`<h2>${esc(c.name)}'s reward settings</h2><p>Choose whether ${esc(c.name)} can earn screen time, money, or both.</p><label style="display:block;margin-top:14px">Reward mode<select id="childRewardMode" class="input"><option value="minutes" ${c.reward_type==='minutes'?'selected':''}>Screen time</option><option value="money" ${c.reward_type==='money'?'selected':''}>Money</option><option value="both" ${c.reward_type==='both'?'selected':''}>Money + screen time</option></select></label><div class="formgrid" style="margin-top:12px"><label>Weekly screen-time hours<input id="childWeeklyScreen" class="input" type="number" min="0" step="0.5" value="${Number(c.weekly_screen_minutes||0)/60}"></label><label>Weekly money allowance<input id="childWeeklyMoney" class="input" type="number" min="0" step="0.25" value="${Number(c.weekly_money_allowance||0)}"></label></div><div class="notice" style="margin-top:12px">Screen-time balances reset every Monday. Money carries forward. Weekly allowances are automatically loaded when FamilyFlow opens.</div><button class="primary" style="width:100%;margin-top:14px" onclick="saveChildRewardSettings('${c.id}')">Save reward settings</button>`)}
async function saveChildRewardSettings(id){const mode=$('childRewardMode').value,weeklyScreen=Math.round(Number($('childWeeklyScreen').value||0)*60),weeklyMoney=Number($('childWeeklyMoney').value||0);const {error}=await sb.rpc('update_child_rewards',{target_child:id,reward_mode:mode,weekly_screen:weeklyScreen,weekly_money:weeklyMoney});if(error)return toast(errText(error));closeModal();toast('Reward settings saved');await loadData();state.view='parent';state.parentUnlocked=true;state.parentTab='settings';render()}
function adjustRewardModal(id){const c=child(id);if(!c)return;const units=rewardOptions(c);modal(`<h2>Add reward for ${esc(c.name)}</h2><p>Add screen time or money for good behavior, a bonus, or a manual adjustment.</p><label style="display:block;margin-top:14px">Reward type<select id="adjustUnit" class="input">${units}</select></label><label style="display:block;margin-top:12px">Amount<input id="adjustAmount" class="input" type="number" step="0.25" placeholder="60"></label><div class="row" style="margin-top:10px">${c.reward_type!=='money'?`<button class="secondary" onclick="prefillAdjustment('minutes',15)">+15 min</button><button class="secondary" onclick="prefillAdjustment('minutes',30)">+30 min</button><button class="secondary" onclick="prefillAdjustment('minutes',60)">+1 hour</button>`:''}${c.reward_type!=='minutes'?`<button class="secondary" onclick="prefillAdjustment('money',1)">+$1</button><button class="secondary" onclick="prefillAdjustment('money',5)">+$5</button><button class="secondary" onclick="prefillAdjustment('money',10)">+$10</button>`:''}</div><label style="display:block;margin-top:12px">Reason<input id="adjustReason" class="input" value="Good behavior" placeholder="Good behavior"></label><p class="small muted" style="margin-top:10px">Use a negative amount if you need to correct a balance.</p><button class="primary" style="width:100%;margin-top:14px" onclick="saveRewardAdjustment('${c.id}')">Add to balance</button>`)}
function prefillAdjustment(unit,amount){const u=$('adjustUnit'),a=$('adjustAmount');if(u)u.value=unit;if(a)a.value=amount}
async function saveRewardAdjustment(id){const unit=$('adjustUnit').value,amount=Number($('adjustAmount').value),reason=$('adjustReason').value.trim();if(!amount)return toast('Enter an amount');const {error}=await sb.rpc('parent_adjust_reward',{target_child:id,target_unit:unit,adjustment:amount,adjustment_reason:reason||'Parent adjustment'});if(error)return toast(errText(error));closeModal();toast(unit==='minutes'?`${amount>0?'+':''}${Math.round(amount)} minutes added`:`${amount>0?'+':''}${money(amount)} added`);await loadData();state.view='parent';state.parentUnlocked=true;state.parentTab='home';render()}

function resetKidPin(id){const c=child(id);modal(`<h2>Reset ${esc(c.name)}'s PIN</h2><label style="display:block;margin-top:12px">New 4-digit PIN<input id="resetPin" class="input pin" inputmode="numeric" maxlength="4" type="password"></label><button class="primary" style="width:100%;margin-top:14px" onclick="saveKidPin('${id}')">Save PIN</button>`)}
async function saveKidPin(id){const pin=$('resetPin').value.trim();const {error}=await sb.rpc('set_child_pin',{child:id,new_pin:pin});if(error)return toast(errText(error));closeModal();toast('PIN updated')}

function manageChildConfirm(id,newActive){
 const c=child(id);if(!c)return;
 const action=newActive?'Restore':'Remove';
 const detail=newActive?'This puts the child back on the family screen.':'This removes the child from the family and kid screens but keeps all history, balances, and past chore records.';
 modal(`<h2>${action} ${esc(c.name)}?</h2><p>${detail}</p><div class="row" style="margin-top:16px"><button class="secondary" style="flex:1" onclick="closeModal()">Cancel</button><button class="${newActive?'primary':'secondary danger'}" style="flex:1" onclick="setChildActive('${c.id}',${newActive})">${action}</button></div>`);
}
async function setChildActive(id,newActive){
 const {error}=await sb.rpc('set_child_active',{target_child:id,new_active:newActive});
 if(error)return toast(errText(error));
 closeModal();toast(newActive?'Child restored':'Child removed');
 await loadData();state.view='parent';state.parentUnlocked=true;state.parentTab='settings';render();
}
function manageChoreConfirm(id,newActive){
 const ch=state.chores.find(x=>x.id===id);if(!ch)return;
 const action=newActive?'Restore':'Remove';
 const detail=newActive?'This makes the chore active again.':'This removes the chore from daily/bonus screens but keeps its history and past rewards.';
 modal(`<h2>${action} ${esc(ch.name)}?</h2><p>${detail}</p><div class="row" style="margin-top:16px"><button class="secondary" style="flex:1" onclick="closeModal()">Cancel</button><button class="${newActive?'primary':'secondary danger'}" style="flex:1" onclick="setChoreActive('${ch.id}',${newActive})">${action}</button></div>`);
}
async function setChoreActive(id,newActive){
 const {error}=await sb.rpc('set_chore_active',{target_chore:id,new_active:newActive});
 if(error)return toast(errText(error));
 closeModal();toast(newActive?'Chore restored':'Chore removed');
 await loadData();state.view='parent';state.parentUnlocked=true;state.parentTab='settings';render();
}

function parentChores(){const q=state.librarySearch.toLowerCase();const lib=state.library.filter(x=>!q||x.name.toLowerCase().includes(q)||x.category.toLowerCase().includes(q)).slice(0,40);return `<div class="row between"><div><h1>Chores</h1><p>Assign from the cloud chore library or make your own.</p></div><button class="primary" onclick="customChoreModal()">+ Custom chore</button></div><div class="section-head"><h2>Assigned</h2></div><div class="card">${state.chores.length?state.chores.map(ch=>{const assigned=state.assignments.filter(a=>a.chore_id===ch.id),names=assigned.map(a=>child(a.child_id)?.name).filter(Boolean).join(', '),c=assigned.length?child(assigned[0].child_id):null,unit=rewardUnitFor(ch,c);return `<div class="task"><div><div class="task-title">${esc(ch.name)}</div><div class="small muted">${esc(names||'Unassigned')} • ${esc(ch.chore_type)} • ${esc(ch.schedule_text||'Daily')}${Number(ch.reward_amount||0)?` • +${fmt(c,ch.reward_amount,unit)}`:''}</div></div><span class="tag ${ch.active?'good':'bad'}">${ch.active?'ACTIVE':'PAUSED'}</span></div>`}).join(''):`<div class="empty">No chores assigned yet.</div>`}</div><div class="section-head"><h2>Chore library</h2></div><div class="toolbar"><input class="search" placeholder="Search 200+ chores" value="${esc(state.librarySearch)}" oninput="setLibrarySearch(this.value)"></div><div class="library" style="margin-top:12px">${lib.map(x=>`<div class="libcard"><div class="row between"><span class="tag blue">${esc(x.category)}</span><span class="small muted">Age ${x.min_age}–${x.max_age}</span></div><h3 style="margin-top:10px">${esc(x.name)}</h3><div class="small muted" style="margin:6px 0 12px">${esc(x.suggested_frequency)} • ${esc(x.difficulty)}</div><button class="secondary" style="width:100%" onclick="assignLibrary(${x.id})">Assign</button></div>`).join('')}</div>`}

function setLibrarySearch(v){state.librarySearch=v;render()}
function assignLibrary(id){const item=state.library.find(x=>Number(x.id)===Number(id));if(!state.children.length)return toast('Add a child first');const first=state.children[0];modal(`<h2>Assign ${esc(item.name)}</h2><label style="display:block">Child<select id="assignChild" class="input" onchange="syncRewardUnit('assignChild','assignRewardUnit')">${state.children.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label><label style="display:block;margin-top:12px">Type<select id="assignType" class="input"><option value="${esc(item.suggested_type)}">${esc(item.suggested_type)}</option><option value="responsibility">responsibility</option><option value="earned">earned</option><option value="bonus">bonus</option></select></label><div class="formgrid" style="margin-top:12px"><label>Reward amount<input id="assignReward" class="input" type="number" step="0.25" value="0"></label><label>Reward as<select id="assignRewardUnit" class="input">${rewardOptions(first)}</select></label></div><button class="primary" style="width:100%;margin-top:14px" onclick="saveLibraryAssignment(${item.id})">Assign chore</button>`)}

async function saveLibraryAssignment(id){const item=state.library.find(x=>Number(x.id)===Number(id)),childId=$('assignChild').value,type=$('assignType').value,reward=Number($('assignReward').value||0),unit=$('assignRewardUnit').value;const {data,error}=await sb.from('chores').insert({family_id:state.family.id,name:item.name,category:item.category,chore_type:type,schedule_text:type==='bonus'?'Bonus job':'Daily',reward_amount:reward,reward_unit:unit,deduction_amount:0,approval_required:true,difficulty:item.difficulty,active:true}).select('id').single();if(error)return toast(errText(error));const {error:ae}=await sb.from('chore_assignments').insert({family_id:state.family.id,chore_id:data.id,child_id:childId});if(ae)return toast(errText(ae));closeModal();toast('Chore assigned');await loadData();state.view='parent';state.parentUnlocked=true;state.parentTab='chores'}

function customChoreModal(){if(!state.children.length)return toast('Add a child first');const first=state.children[0];modal(`<h2>Custom chore</h2><div class="formgrid"><label>Name<input id="customName" class="input"></label><label>Category<input id="customCategory" class="input" value="Helping Family"></label><label>Child<select id="customChild" class="input" onchange="syncRewardUnit('customChild','customRewardUnit')">${state.children.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label><label>Type<select id="customType" class="input"><option value="responsibility">Responsibility</option><option value="earned">Earned</option><option value="bonus">Bonus job</option></select></label><label>Reward<input id="customReward" class="input" type="number" step="0.25" value="0"></label><label>Reward as<select id="customRewardUnit" class="input">${rewardOptions(first)}</select></label><label>Deduction<input id="customDeduction" class="input" type="number" value="0"></label></div><button class="primary" style="width:100%;margin-top:14px" onclick="saveCustomChore()">Create chore</button>`)}

async function saveCustomChore(){const returnTab=state.parentTab==='settings'?'settings':'chores',name=$('customName').value.trim();if(!name)return toast('Enter a chore name');const type=$('customType').value;const {data,error}=await sb.from('chores').insert({family_id:state.family.id,name,category:$('customCategory').value.trim()||'Helping Family',chore_type:type,schedule_text:type==='bonus'?'Bonus job':'Daily',reward_amount:Number($('customReward').value||0),reward_unit:$('customRewardUnit').value,deduction_amount:Number($('customDeduction').value||0),approval_required:true,active:true}).select('id').single();if(error)return toast(errText(error));const {error:ae}=await sb.from('chore_assignments').insert({family_id:state.family.id,chore_id:data.id,child_id:$('customChild').value});if(ae)return toast(errText(ae));closeModal();toast('Chore created');await loadData();state.view='parent';state.parentUnlocked=true;state.parentTab=returnTab;render()}
function syncRewardUnit(childSelectId,rewardSelectId){const c=child($(childSelectId).value),sel=$(rewardSelectId);if(sel)sel.innerHTML=rewardOptions(c)}

function parentReports(){return `<h1>Reports</h1><p>The ledger is the source of truth for balances.</p><div class="section-head"><h2>Recent ledger activity</h2></div><div class="card tablewrap"><table class="table"><thead><tr><th>Date</th><th>Child</th><th>Reason</th><th>Type</th><th>Reward</th><th>Amount</th></tr></thead><tbody>${state.ledger.map(t=>{const c=child(t.child_id),unit=t.reward_unit||(c?.reward_type==='money'?'money':'minutes');return `<tr><td>${new Date(t.created_at).toLocaleDateString()}</td><td>${esc(c?.name||'')}</td><td>${esc(t.reason)}</td><td>${esc(t.transaction_type)}</td><td>${unit==='money'?'Money':'Screen time'}</td><td class="${Number(t.amount)>=0?'ledger-pos':'ledger-neg'}">${Number(t.amount)>=0?'+':''}${fmt(c,t.amount,unit)}</td></tr>`}).join('')}</tbody></table></div>`}

function parentSettings(){
 const s=state.settings||{};
 const childRows=(state.allChildren||[]).map(c=>`<tr><td><b>${esc(c.name)}</b><div class="small muted">Age ${c.age}</div></td><td>${rewardModeLabel(c.reward_type)}${Number(c.weekly_screen_minutes||0)>0?`<div class="small muted">${Math.round(Number(c.weekly_screen_minutes)/60*10)/10} hr screen/week</div>`:''}${Number(c.weekly_money_allowance||0)>0?`<div class="small muted">${money(c.weekly_money_allowance)}/week</div>`:''}</td><td><span class="tag ${c.active?'good':'bad'}">${c.active?'ACTIVE':'REMOVED'}</span></td><td><div class="row">${c.active?`<button class="primary" onclick="adjustRewardModal('${c.id}')">+ Reward</button><button class="secondary" onclick="rewardSettingsModal('${c.id}')">Rewards</button><button class="secondary" onclick="resetKidPin('${c.id}')">Reset PIN</button><button class="secondary danger" onclick="manageChildConfirm('${c.id}',false)">Remove</button>`:`<button class="secondary" onclick="manageChildConfirm('${c.id}',true)">Restore</button>`}</div></td></tr>`).join('');
 const choreRows=state.chores.map(ch=>{const names=state.assignments.filter(a=>a.chore_id===ch.id).map(a=>child(a.child_id)?.name).filter(Boolean).join(', ');return `<tr><td><b>${esc(ch.name)}</b><div class="small muted">${esc(ch.category||'')}</div></td><td>${esc(names||'Unassigned')}</td><td>${esc(ch.chore_type)}${Number(ch.reward_amount||0)?`<div class="small muted">${fmt(null,ch.reward_amount,ch.reward_unit||'minutes')}</div>`:''}</td><td><span class="tag ${ch.active?'good':'bad'}">${ch.active?'ACTIVE':'REMOVED'}</span></td><td>${ch.active?`<button class="secondary danger" onclick="manageChoreConfirm('${ch.id}',false)">Remove</button>`:`<button class="secondary" onclick="manageChoreConfirm('${ch.id}',true)">Restore</button>`}</td></tr>`}).join('');
 return `<h1>Settings</h1><p>Family defaults, security, kids, rewards, and chore management.</p>
 <div class="grid cols-2" style="margin-top:16px">
   <div class="card"><h3>Screen-time rules</h3><label style="display:block;margin-top:12px">Daily maximum<input id="setLimit" class="input" type="number" value="${s.tablet_daily_limit??60}"></label><label style="display:block;margin-top:12px">Minimum redemption<input id="setMin" class="input" type="number" value="${s.tablet_min_redemption??15}"></label><button class="primary" style="width:100%;margin-top:14px" onclick="saveSettings()">Save screen-time settings</button></div>
   <div class="card"><h3>Parent PIN</h3><p style="margin:8px 0 12px">Change the PIN used to unlock Parent Mode.</p><input id="newParentPin" class="input pin" inputmode="numeric" maxlength="8" type="password" placeholder="New PIN"><button class="secondary" style="width:100%;margin-top:10px" onclick="changeParentPin()">Change PIN</button></div>
 </div>
 <div class="section-head"><div><h2 style="margin-bottom:3px">Manage kids & rewards</h2><p class="small">Each child can use screen time, money, or both. Set weekly allowances or add one-time bonuses.</p></div><button class="primary" onclick="addChildModal()">+ Add child</button></div>
 <div class="card tablewrap"><table class="table"><thead><tr><th>Child</th><th>Rewards</th><th>Status</th><th>Actions</th></tr></thead><tbody>${childRows||`<tr><td colspan="4"><div class="empty">No children yet.</div></td></tr>`}</tbody></table></div>
 <div class="section-head"><div><h2 style="margin-bottom:3px">Manage chores</h2><p class="small">Add, remove, or restore chores without deleting history.</p></div><div class="row"><button class="secondary" onclick="parentTab('chores')">Browse library</button><button class="primary" onclick="customChoreModal()">+ Add chore</button></div></div>
 <div class="card tablewrap"><table class="table"><thead><tr><th>Chore</th><th>Assigned to</th><th>Type / reward</th><th>Status</th><th>Action</th></tr></thead><tbody>${choreRows||`<tr><td colspan="5"><div class="empty">No chores yet.</div></td></tr>`}</tbody></table></div>`;
}

async function saveSettings(){const {error}=await sb.from('family_settings').update({tablet_daily_limit:Number($('setLimit').value||60),tablet_min_redemption:Number($('setMin').value||15),updated_at:new Date().toISOString()}).eq('family_id',state.family.id);if(error)return toast(errText(error));toast('Settings saved');await loadData();state.view='parent';state.parentUnlocked=true;state.parentTab='settings'}
async function changeParentPin(){const pin=$('newParentPin').value.trim();const {error}=await sb.rpc('set_parent_pin',{target_family:state.family.id,new_pin:pin});if(error)return toast(errText(error));toast('Parent PIN changed');$('newParentPin').value=''}

function render(){const root=$('app');if(state.loading){root.innerHTML='<div class="spinner"></div>';return}if(state.recovery&&state.session){root.innerHTML=recoveryView();return}if(!state.session){root.innerHTML=loginView();return}if(!state.family){root.innerHTML=onboardingView();return}if(!state.hasParentPin){root.innerHTML=parentPinSetupView();return}root.innerHTML=state.view==='kid'&&state.kidId?kidView():state.view==='parent'&&state.parentUnlocked?parentView():familyView()}
Object.assign(window,{signIn,signUp,signOut,forgotPassword,sendPasswordReset,saveNewPassword,finishParentPinSetup,createFamily,closeModal,kidPin,verifyKid,exitKid,kidTab,markDone,dismissRejectedNotice,requestMinutes,claimBonus,parentPin,resetParentPinModal,saveResetParentPin,verifyParent,exitParent,parentTab,approveCompletion,rejectCompletion,approveRedemption,rejectRedemption,addChildModal,addChild,rewardSettingsModal,saveChildRewardSettings,adjustRewardModal,prefillAdjustment,saveRewardAdjustment,resetKidPin,saveKidPin,manageChildConfirm,setChildActive,manageChoreConfirm,setChoreActive,setLibrarySearch,assignLibrary,saveLibraryAssignment,customChoreModal,saveCustomChore,syncRewardUnit,saveSettings,changeParentPin});
if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
init();
</script>
</body>
</html>
