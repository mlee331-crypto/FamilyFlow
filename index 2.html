<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6feb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FamilyFlow">
<link rel="manifest" href="./manifest.webmanifest">
<title>FamilyFlow — Chores & Rewards</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#152033;--muted:#667085;--line:#e6eaf0;--accent:#1f6feb;--accent2:#7c3aed;--good:#16803c;--warn:#b54708;--bad:#b42318;--shadow:0 8px 28px rgba(31,45,61,.08);--radius:22px}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:1180px;margin:auto;min-height:100vh;padding-bottom:94px}.topbar{position:sticky;top:0;z-index:20;background:rgba(245,247,251,.92);backdrop-filter:blur(16px);border-bottom:1px solid rgba(230,234,240,.9);padding:12px 16px;display:flex;align-items:center;gap:10px}.brand{font-weight:900;letter-spacing:-.04em;font-size:21px;white-space:nowrap}.brand span{color:var(--accent)}.spacer{flex:1}.mode-btn,.pill-btn,.icon-btn{border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px 12px;color:var(--ink);font-weight:700}.mode-btn.active{background:var(--ink);color:#fff;border-color:var(--ink)}main{padding:18px 16px 30px}h1{font-size:31px;line-height:1.05;margin:6px 0 6px;letter-spacing:-.04em}h2{font-size:22px;margin:0 0 12px;letter-spacing:-.025em}h3{font-size:16px;margin:0}p{margin:0;color:var(--muted)}.grid{display:grid;gap:14px}.grid.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:17px}.stat{padding:14px}.stat b{font-size:25px;display:block;margin-top:5px}.muted{color:var(--muted)}.small{font-size:12px}.hero{padding:18px;background:linear-gradient(135deg,#eef5ff,#f4efff)}.progress{height:10px;background:#e9edf4;border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px}.kid-card{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}.avatar{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;background:#eef4ff;color:var(--accent);font-weight:900;font-size:20px}.balance{font-weight:900;font-size:20px;text-align:right}.tag{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:6px 9px;background:#f0f3f7;color:#475467;font-size:12px;font-weight:800}.tag.good{background:#eaf8ef;color:var(--good)}.tag.warn{background:#fff3e7;color:var(--warn)}.tag.bad{background:#ffefed;color:var(--bad)}.tag.blue{background:#edf4ff;color:var(--accent)}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 0 10px}.task{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}.task:first-child{border-top:0;padding-top:0}.task-title{font-weight:850;margin-bottom:5px}.reward{font-weight:900;color:var(--good)}.done-btn,.primary{border:0;border-radius:15px;background:var(--accent);color:#fff;font-weight:850;padding:12px 16px;min-height:46px}.secondary{border:1px solid var(--line);border-radius:15px;background:#fff;color:var(--ink);font-weight:800;padding:11px 14px;min-height:44px}.danger{border-color:#f5c2bd;color:var(--bad);background:#fff6f5}.success{background:var(--good)}.reject{background:#fff;color:var(--bad);border:1px solid #f0b9b5}.pending{background:#fff7ed;border:1px solid #fed7aa}.big-balance{font-size:42px;font-weight:950;letter-spacing:-.05em;margin:4px 0}.bottomnav{position:fixed;z-index:30;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:7px 8px calc(7px + env(safe-area-inset-bottom));display:flex;justify-content:center}.bottomnav .navwrap{width:min(100%,900px);display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}.navitem{border:0;background:transparent;border-radius:12px;padding:8px 5px;color:#667085;font-weight:800;font-size:11px}.navitem span{display:block;font-size:19px;margin-bottom:2px}.navitem.active{background:#edf4ff;color:var(--accent)}.toolbar{display:grid;grid-template-columns:1fr auto auto;gap:8px}.search,.select,.input{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 13px;outline:none}.library{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.libcard{border:1px solid var(--line);border-radius:17px;padding:14px;background:#fff}.modalback{position:fixed;z-index:100;inset:0;background:rgba(17,24,39,.45);display:grid;place-items:end center}.modal{width:min(100%,650px);max-height:90vh;overflow:auto;background:#fff;border-radius:26px 26px 0 0;padding:20px 18px calc(28px + env(safe-area-inset-bottom));box-shadow:0 -15px 60px rgba(0,0,0,.2)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-size:12px;font-weight:800;color:#475467}label input,label select{margin-top:6px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.row.between{justify-content:space-between}.divider{height:1px;background:var(--line);margin:15px 0}.empty{padding:28px;text-align:center;color:var(--muted)}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line);font-size:13px}.table th{color:#667085;font-size:11px;text-transform:uppercase;letter-spacing:.05em}.ledger-pos{color:var(--good);font-weight:900}.ledger-neg{color:var(--bad);font-weight:900}.login{max-width:460px;margin:8vh auto 0}.pin{font-size:26px;letter-spacing:.32em;text-align:center;font-weight:900}.notice{border-radius:14px;padding:11px 12px;background:#eef5ff;color:#264c87;font-size:13px}.error{background:#fff0ef;color:#9b1c13}.toast{position:fixed;z-index:200;left:50%;bottom:95px;transform:translateX(-50%);background:#111827;color:#fff;border-radius:99px;padding:10px 15px;font-weight:800;font-size:13px;box-shadow:var(--shadow)}.spinner{width:34px;height:34px;border:4px solid #dce6f7;border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:20vh auto}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:760px){.grid.cols-4,.grid.cols-3{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.cols-2{grid-template-columns:1fr}.library{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr}h1{font-size:27px}.topbar .mode-btn{padding:9px 10px;font-size:12px}}
@media(max-width:430px){main{padding-left:12px;padding-right:12px}.card{padding:14px;border-radius:18px}.kid-card{grid-template-columns:auto 1fr}.kid-card .balance{grid-column:1/-1;text-align:left}.formgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app" class="app"><div class="spinner"></div></div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL='https://dxzgpcquvwjacnxjjumg.supabase.co';
const SUPABASE_KEY='sb_publishable_wLnZ8wQlzFzKVjr95mEziA_KePU101A';
const sb=createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(n||0));
const fmt=(child,n)=>child?.reward_type==='money'?money(n):`${Math.round(Number(n||0))} min`;
const state={session:null,user:null,family:null,settings:null,hasParentPin:true,children:[],balances:{},chores:[],assignments:[],completions:[],ledger:[],redemptions:[],library:[],badges:[],streaks:[],view:'family',kidId:null,parentUnlocked:false,parentTab:'home',kidTab:'today',loading:true,librarySearch:'',recovery:(location.hash.includes('type=recovery')||location.search.includes('type=recovery'))};

function toast(msg){document.querySelector('.toast')?.remove();const d=document.createElement('div');d.className='toast';d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
function errText(e){return e?.message||String(e||'Something went wrong')}
function modal(html){closeModal();const d=document.createElement('div');d.id='modalBack';d.className='modalback';d.innerHTML=`<div class="modal"><div class="row between" style="margin-bottom:8px"><div></div><button class="icon-btn" onclick="closeModal()">✕</button></div>${html}</div>`;d.onclick=e=>{if(e.target===d)closeModal()};document.body.appendChild(d)}
function closeModal(){document.getElementById('modalBack')?.remove()}
function child(id){return state.children.find(c=>c.id===id)}
function chore(id){return state.chores.find(c=>c.id===id)}
function completionFor(choreId,childId){return state.completions.find(x=>x.chore_id===choreId&&x.child_id===childId&&x.due_date===today())}
function balance(id){return Number(state.balances[id]||0)}
function pendingCount(){return state.completions.filter(x=>x.status==='pending').length+state.redemptions.filter(x=>x.status==='pending').length}

async function init(){
 sb.auth.onAuthStateChange(async(event,s)=>{
   state.session=s;state.user=s?.user||null;
   if(event==='PASSWORD_RECOVERY'){state.recovery=true;state.loading=false;render();return}
   if(s){if(!state.recovery)await loadData();else{state.loading=false;render()}}
   else{resetState();render()}
 });
 const {data:{session}}=await sb.auth.getSession();state.session=session;state.user=session?.user||null;
 if(state.recovery&&session){state.loading=false;render();return}
 if(session)await loadData();else{state.loading=false;render()}
}
function resetState(){Object.assign(state,{family:null,settings:null,hasParentPin:true,children:[],balances:{},chores:[],assignments:[],completions:[],ledger:[],redemptions:[],library:[],badges:[],streaks:[],view:'family',kidId:null,parentUnlocked:false,loading:false})}

async function loadData(){
 state.loading=true;render();
 try{
  const {data:fams,error:fe}=await sb.from('families').select('id,name,owner_user_id,created_at').order('created_at',{ascending:true}).limit(1);if(fe)throw fe;
  state.family=fams?.[0]||null;
  if(!state.family){state.loading=false;render();return}
  const fid=state.family.id;
  const [settingsR,pinStatusR,childrenR,balancesR,choresR,assignR,libraryR,badgesR,streaksR]=await Promise.all([
   sb.from('family_settings').select('family_id,tablet_daily_limit,tablet_min_redemption,updated_at').eq('family_id',fid).maybeSingle(),
   sb.rpc('has_parent_pin',{target_family:fid}),
   sb.from('children').select('id,family_id,name,age,reward_type,avatar,active,created_at').eq('family_id',fid).eq('active',true).order('created_at'),
   sb.from('child_balances').select('child_id,balance,reward_type').eq('family_id',fid),
   sb.from('chores').select('*').eq('family_id',fid).order('created_at'),
   sb.from('chore_assignments').select('*').eq('family_id',fid),
   sb.from('chore_library').select('id,name,category,min_age,max_age,suggested_frequency,difficulty,suggested_type,popular_score').eq('active',true).order('popular_score',{ascending:false}).limit(250),
   sb.from('badges').select('*').eq('family_id',fid).order('awarded_at',{ascending:false}),
   sb.from('streaks').select('*').eq('family_id',fid)
  ]);
  for(const r of [settingsR,pinStatusR,childrenR,balancesR,choresR,assignR,libraryR,badgesR,streaksR])if(r.error)throw r.error;
  state.settings=settingsR.data||{};state.hasParentPin=!!pinStatusR.data;state.children=childrenR.data||[];state.chores=choresR.data||[];state.assignments=assignR.data||[];state.library=libraryR.data||[];state.badges=badgesR.data||[];state.streaks=streaksR.data||[];
  state.balances={};for(const b of balancesR.data||[])state.balances[b.child_id]=Number(b.balance||0);
  await ensureTodayCompletions();
  const [compR,ledgerR,redR]=await Promise.all([
   sb.from('chore_completions').select('*').eq('family_id',fid).gte('due_date',new Date(Date.now()-14*86400000).toISOString().slice(0,10)).order('due_date',{ascending:false}),
   sb.from('reward_transactions').select('*').eq('family_id',fid).order('created_at',{ascending:false}).limit(150),
   sb.from('tablet_redemptions').select('*').eq('family_id',fid).order('requested_at',{ascending:false}).limit(100)
  ]);
  for(const r of [compR,ledgerR,redR])if(r.error)throw r.error;
  state.completions=compR.data||[];state.ledger=ledgerR.data||[];state.redemptions=redR.data||[];
 }catch(e){console.error(e);toast(errText(e))}
 state.loading=false;render();
}

async function ensureTodayCompletions(){
 if(!state.family)return;
 const rows=[];
 for(const a of state.assignments){const ch=state.chores.find(x=>x.id===a.chore_id);if(!ch||!ch.active||ch.chore_type==='bonus')continue;rows.push({family_id:state.family.id,chore_id:a.chore_id,child_id:a.child_id,due_date:today(),status:'todo'})}
 if(rows.length){const {error}=await sb.from('chore_completions').upsert(rows,{onConflict:'chore_id,child_id,due_date',ignoreDuplicates:true});if(error)console.warn(error)}
}

async function signIn(){const email=$('email').value.trim(),password=$('password').value;const {error}=await sb.auth.signInWithPassword({email,password});if(error)toast(errText(error))}
function forgotPassword(){
 const current=$('email')?.value?.trim()||'';
 modal(`<h2>Forgot password?</h2><p>Enter the email used for FamilyFlow. We’ll send a secure reset link.</p><label style="display:block;margin-top:16px">Email<input id="resetEmail" class="input" type="email" autocomplete="email" value="${esc(current)}" placeholder="you@example.com"></label><button class="primary" style="width:100%;margin-top:14px" onclick="sendPasswordReset()">Send reset email</button>`);
}
async function sendPasswordReset(){
 const email=$('resetEmail').value.trim();
 if(!email)return toast('Enter your email');
 const last=Number(localStorage.getItem('familyflow-reset-request-at')||0);
 const wait=Math.ceil((90000-(Date.now()-last))/1000);
 if(wait>0)return toast(`Please wait ${wait}s before requesting another reset email`);
 const btn=document.querySelector('#modalBack .primary');
 if(btn){btn.disabled=true;btn.textContent='Sending…'}
 const redirectTo=location.origin+location.pathname;
 const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo});
 if(error){
   if(btn){btn.disabled=false;btn.textContent='Send reset email'}
   const m=(error.message||'').toLowerCase();
   if(m.includes('rate limit'))return toast('Supabase email limit reached. Wait a bit, then request one new email.');
   return toast(errText(error));
 }
 localStorage.setItem('familyflow-reset-request-at',String(Date.now()));
 closeModal();toast('Reset email sent — use the newest email only');
}
function recoveryView(){return `<main><div class="login card"><div class="brand">Family<span>Flow</span></div><h1 style="margin-top:18px">Choose a new password</h1><p>Enter a new password for your FamilyFlow parent account.</p><label style="display:block;margin-top:18px">New password<input id="newPassword" class="input" type="password" autocomplete="new-password" placeholder="At least 6 characters"></label><label style="display:block;margin-top:12px">Confirm password<input id="confirmPassword" class="input" type="password" autocomplete="new-password" placeholder="Repeat password"></label><button class="primary" style="width:100%;margin-top:16px" onclick="saveNewPassword()">Update password</button></div></main>`}
async function saveNewPassword(){
 const p=$('newPassword').value,c=$('confirmPassword').value;
 if(p.length<6)return toast('Use at least 6 characters');
 if(p!==c)return toast('Passwords do not match');
 const {error}=await sb.auth.updateUser({password:p});
 if(error)return toast(errText(error));
 state.recovery=false;history.replaceState({},document.title,location.pathname);toast('Password updated');
 await loadData();
}
function parentPinSetupView(){return `${topbar()}<main><div class="login card"><div class="brand">Family<span>Flow</span></div><h1 style="margin-top:18px">Finish family setup</h1><p>Your family account exists. Set the Parent PIN to finish setup.</p><label style="display:block;margin-top:18px">Parent PIN<input id="finishParentPin" class="input pin" inputmode="numeric" maxlength="8" type="password" placeholder="4–8 digits"></label><button class="primary" style="width:100%;margin-top:16px" onclick="finishParentPinSetup()">Save Parent PIN</button></div></main>`}
async function finishParentPinSetup(){
 const pin=$('finishParentPin').value.trim();
 if(!/^\d{4,8}$/.test(pin))return toast('Parent PIN must be 4–8 digits');
 const {error}=await sb.rpc('set_parent_pin',{target_family:state.family.id,new_pin:pin});
 if(error)return toast(errText(error));
 toast('Parent PIN saved');await loadData();
}
async function signUp(){const email=$('email').value.trim(),password=$('password').value;if(password.length<6)return toast('Use at least 6 characters');const {data,error}=await sb.auth.signUp({email,password});if(error)return toast(errText(error));if(!data.session)toast('Account created. Check your email to confirm, then sign in.');else toast('Account created')}
async function signOut(){await sb.auth.signOut()}
async function createFamily(){const name=$('familyName').value.trim(),pin=$('parentPin').value.trim();if(!name)return toast('Enter a family name');if(!/^\d{4,8}$/.test(pin))return toast('Parent PIN must be 4–8 digits');const {data,error}=await sb.rpc('create_family',{family_name:name});if(error)return toast(errText(error));const {error:pe}=await sb.rpc('set_parent_pin',{target_family:data,new_pin:pin});if(pe)return toast(errText(pe));toast('Family created');await loadData()}

function loginView(){return `<main><div class="login card"><div class="brand">Family<span>Flow</span></div><h1 style="margin-top:18px">Your family, in sync.</h1><p>Sign in as a parent. Kids use their own PIN after you sign in.</p><div style="margin-top:18px"><label>Email<input id="email" class="input" type="email" autocomplete="email" placeholder="you@example.com"></label><label style="display:block;margin-top:12px">Password<input id="password" class="input" type="password" autocomplete="current-password" placeholder="6+ characters"></label></div><div class="row" style="margin-top:14px"><button class="primary" onclick="signIn()">Sign in</button><button class="secondary" onclick="signUp()">Create account</button></div><button class="secondary" style="width:100%;margin-top:10px;border:0;background:transparent;color:var(--accent)" onclick="forgotPassword()">Forgot password?</button><div class="notice" style="margin-top:10px">No Google login is required. Your family data is stored in the FamilyFlow Supabase database.</div></div></main>`}
function onboardingView(){return `<main><div class="login card"><div class="brand">Family<span>Flow</span></div><h1 style="margin-top:18px">Create your family</h1><p>This is the one-time setup for this parent account.</p><label style="display:block;margin-top:18px">Family name<input id="familyName" class="input" placeholder="The Ludwig Family"></label><label style="display:block;margin-top:12px">Parent PIN<input id="parentPin" class="input pin" inputmode="numeric" maxlength="8" placeholder="••••"></label><button class="primary" style="width:100%;margin-top:16px" onclick="createFamily()">Create FamilyFlow</button><button class="secondary" style="width:100%;margin-top:10px" onclick="signOut()">Sign out</button></div></main>`}

function topbar(){return `<div class="topbar"><div class="brand">Family<span>Flow</span></div><div class="spacer"></div>${state.view==='kid'?`<button class="mode-btn" onclick="exitKid()">Family</button>`:''}${state.view==='parent'?`<button class="mode-btn" onclick="exitParent()">Family</button><button class="icon-btn" onclick="signOut()" title="Sign out">↪</button>`:''}</div>`}
function familyView(){
 const cards=state.children.map(c=>{const todays=state.completions.filter(x=>x.child_id===c.id&&x.due_date===today());const done=todays.filter(x=>x.status==='approved').length;const pct=todays.length?Math.round(done/todays.length*100):0;const streak=state.streaks.find(s=>s.child_id===c.id)?.current_daily||0;return `<button class="card kid-card" style="text-align:left;width:100%" onclick="kidPin('${c.id}')"><div class="avatar">${esc(c.avatar||c.name[0])}</div><div><h3>${esc(c.name)}</h3><div class="small muted">${done}/${todays.length} approved today • 🔥 ${streak} day streak</div><div class="progress" style="margin-top:8px"><i style="width:${pct}%"></i></div></div><div class="balance">${fmt(c,balance(c.id))}</div></button>`}).join('');
 return `${topbar()}<main><div class="hero card"><div class="row between"><div><span class="tag blue">LIVE CLOUD DATA</span><h1>${esc(state.family.name)}</h1><p>Tap a child to enter Kid Mode, or unlock Parent Mode.</p></div><button class="primary" onclick="parentPin()">Parent Mode${pendingCount()?` • ${pendingCount()}`:''}</button></div></div><div class="section-head"><h2>Kids</h2><button class="secondary" onclick="parentPin('kids')">+ Add child</button></div>${state.children.length?`<div class="grid cols-2">${cards}</div>`:`<div class="card empty">No kids yet. Open Parent Mode to add your first child.</div>`}</main>`}

function kidPin(id){const c=child(id);modal(`<h2>${esc(c.name)}</h2><p>Enter ${esc(c.name)}'s 4-digit PIN.</p><label style="display:block;margin-top:16px">PIN<input id="kidPinInput" class="input pin" inputmode="numeric" maxlength="4" type="password"></label><button class="primary" style="width:100%;margin-top:14px" onclick="verifyKid('${id}')">Open Kid Mode</button>`);setTimeout(()=>$('kidPinInput')?.focus(),100)}
async function verifyKid(id){const pin=$('kidPinInput').value.trim();const {data,error}=await sb.rpc('verify_child_pin',{child:id,candidate_pin:pin});if(error)return toast(errText(error));if(!data)return toast('Wrong PIN');closeModal();state.kidId=id;state.view='kid';state.kidTab='today';render()}
function exitKid(){state.kidId=null;state.view='family';render()}

function kidView(){const c=child(state.kidId);if(!c)return familyView();const tabs=[['today','Today','✓'],['rewards','Rewards','★'],['jobs','Jobs','＋'],['progress','Progress','🔥']];let content=state.kidTab==='today'?kidToday(c):state.kidTab==='rewards'?kidRewards(c):state.kidTab==='jobs'?kidJobs(c):kidProgress(c);return `${topbar()}<main><div class="hero card"><div class="row between"><div><div class="row"><div class="avatar">${esc(c.avatar||c.name[0])}</div><div><h1 style="margin:0">Hi, ${esc(c.name)}!</h1><p>${fmt(c,balance(c.id))} available</p></div></div></div></div></div>${content}</main><div class="bottomnav"><div class="navwrap">${tabs.map(t=>`<button class="navitem ${state.kidTab===t[0]?'active':''}" onclick="kidTab('${t[0]}')"><span>${t[2]}</span>${t[1]}</button>`).join('')}</div></div>`}
function kidTab(t){state.kidTab=t;render()}
function kidToday(c){const rows=state.assignments.filter(a=>a.child_id===c.id).map(a=>chore(a.chore_id)).filter(ch=>ch&&ch.active&&ch.chore_type!=='bonus');if(!rows.length)return `<div class="section-head"><h2>Today</h2></div><div class="card empty">Nothing assigned today 🎉</div>`;return `<div class="section-head"><h2>Today</h2></div><div class="card">${rows.map(ch=>{const comp=completionFor(ch.id,c.id);const st=comp?.status||'todo';const reward=Number(ch.reward_amount||0);return `<div class="task"><div><div class="task-title">${esc(ch.name)}</div><div class="row"><span class="tag ${st==='approved'?'good':st==='pending'?'warn':st==='missed'?'bad':'blue'}">${st==='todo'?'TO DO':st.toUpperCase()}</span>${reward?`<span class="reward">+${fmt(c,reward)}</span>`:''}${ch.due_time?`<span class="small muted">Due ${esc(ch.due_time)}</span>`:''}</div></div>${st==='todo'?`<button class="done-btn" onclick="markDone('${comp?.id||''}','${ch.id}','${c.id}')">DONE</button>`:st==='pending'?`<span class="tag warn">Waiting for parent</span>`:st==='approved'?`<span class="tag good">✓ Approved</span>`:`<span class="tag">${esc(st)}</span>`}</div>`}).join('')}</div>`}
async function markDone(compId,choreId,childId){try{let id=compId;if(!id){const {data,error}=await sb.from('chore_completions').insert({family_id:state.family.id,chore_id:choreId,child_id:childId,due_date:today(),status:'pending',submitted_at:new Date().toISOString()}).select('id').single();if(error)throw error;id=data.id}else{const {error}=await sb.from('chore_completions').update({status:'pending',submitted_at:new Date().toISOString()}).eq('id',id);if(error)throw error}toast('Sent to parent for approval');await loadData();state.view='kid';state.kidId=childId;state.kidTab='today'}catch(e){toast(errText(e))}}
function kidRewards(c){const reqs=state.redemptions.filter(r=>r.child_id===c.id).slice(0,8);return `<div class="section-head"><h2>Rewards</h2></div><div class="card"><div class="small muted">Available balance</div><div class="big-balance">${fmt(c,balance(c.id))}</div>${c.reward_type==='minutes'?`<p>Trade earned minutes for tablet time.</p><div class="row" style="margin-top:14px">${[15,30,60].map(n=>`<button class="secondary" onclick="requestMinutes(${n})">${n} min</button>`).join('')}</div>`:`<p>Money is tracked in the permanent FamilyFlow ledger.</p>`}</div>${reqs.length?`<div class="section-head"><h2>Recent requests</h2></div><div class="card">${reqs.map(r=>`<div class="row between" style="padding:9px 0;border-bottom:1px solid var(--line)"><span>${r.minutes} min</span><span class="tag ${r.status==='approved'?'good':r.status==='pending'?'warn':'bad'}">${esc(r.status)}</span></div>`).join('')}</div>`:''}`}
async function requestMinutes(n){const c=child(state.kidId);const {error}=await sb.rpc('request_tablet_redemption',{target_family:state.family.id,target_child:c.id,requested_minutes:n});if(error)return toast(errText(error));toast('Request sent to parent');await loadData();state.view='kid';state.kidId=c.id;state.kidTab='rewards'}
function kidJobs(c){const jobs=state.assignments.filter(a=>a.child_id===c.id).map(a=>chore(a.chore_id)).filter(ch=>ch&&ch.active&&ch.chore_type==='bonus');return `<div class="section-head"><h2>Bonus Jobs</h2></div>${jobs.length?`<div class="grid">${jobs.map(ch=>`<div class="card"><div class="row between"><div><h3>${esc(ch.name)}</h3><div class="reward" style="margin-top:6px">+${fmt(c,ch.reward_amount)}</div></div><button class="primary" onclick="claimBonus('${ch.id}','${c.id}')">Claim job</button></div></div>`).join('')}</div>`:`<div class="card empty">No bonus jobs available.</div>`}`}
async function claimBonus(choreId,childId){const {error}=await sb.from('chore_completions').upsert({family_id:state.family.id,chore_id:choreId,child_id:childId,due_date:today(),status:'pending',submitted_at:new Date().toISOString()},{onConflict:'chore_id,child_id,due_date'});if(error)return toast(errText(error));toast('Job claimed — waiting for parent');await loadData();state.view='kid';state.kidId=childId;state.kidTab='jobs'}
function kidProgress(c){const streak=state.streaks.find(s=>s.child_id===c.id);const badges=state.badges.filter(b=>b.child_id===c.id);const recent=state.ledger.filter(t=>t.child_id===c.id).slice(0,10);return `<div class="section-head"><h2>Progress</h2></div><div class="grid cols-2"><div class="card stat"><span class="small muted">Current streak</span><b>🔥 ${streak?.current_daily||0} days</b></div><div class="card stat"><span class="small muted">Best streak</span><b>${streak?.longest_daily||0} days</b></div></div><div class="section-head"><h2>Badges</h2></div><div class="card">${badges.length?badges.map(b=>`<div class="row" style="padding:9px 0"><span style="font-size:24px">🏅</span><b>${esc(b.badge_name)}</b></div>`).join(''):`<div class="empty">Complete chores to earn badges.</div>`}</div><div class="section-head"><h2>Recent activity</h2></div><div class="card">${recent.length?recent.map(t=>`<div class="row between" style="padding:9px 0;border-bottom:1px solid var(--line)"><span>${esc(t.reason)}</span><b class="${Number(t.amount)>=0?'ledger-pos':'ledger-neg'}">${Number(t.amount)>=0?'+':''}${fmt(c,t.amount)}</b></div>`).join(''):`<div class="empty">No activity yet.</div>`}</div>`}

function parentPin(openTab){modal(`<h2>Parent Mode</h2><p>Enter the family Parent PIN.</p><label style="display:block;margin-top:16px">Parent PIN<input id="parentPinInput" class="input pin" inputmode="numeric" maxlength="8" type="password"></label><button class="primary" style="width:100%;margin-top:14px" onclick="verifyParent('${openTab||'home'}')">Unlock</button><button class="secondary" style="width:100%;margin-top:10px;border:0;background:transparent;color:var(--accent)" onclick="resetParentPinModal()">Forgot Parent PIN?</button>`);setTimeout(()=>$('parentPinInput')?.focus(),100)}
function resetParentPinModal(){modal(`<h2>Reset Parent PIN</h2><p>For security, re-enter the parent account password, then choose a new Parent PIN.</p><label style="display:block;margin-top:16px">Account password<input id="resetParentPassword" class="input" type="password" autocomplete="current-password" placeholder="Parent account password"></label><label style="display:block;margin-top:12px">New Parent PIN<input id="resetParentPinInput" class="input pin" inputmode="numeric" maxlength="8" type="password" placeholder="4–8 digits"></label><label style="display:block;margin-top:12px">Confirm Parent PIN<input id="resetParentPinConfirm" class="input pin" inputmode="numeric" maxlength="8" type="password" placeholder="Repeat PIN"></label><button class="primary" style="width:100%;margin-top:14px" onclick="saveResetParentPin()">Verify & save new PIN</button><p class="small muted" style="margin-top:10px">If you also forgot the account password, use Forgot password? on the sign-in screen first.</p>`)}
async function saveResetParentPin(){const pw=$('resetParentPassword').value,p=$('resetParentPinInput').value.trim(),c=$('resetParentPinConfirm').value.trim();if(!pw)return toast('Enter the parent account password');if(!/^\d{4,8}$/.test(p))return toast('Parent PIN must be 4–8 digits');if(p!==c)return toast('PINs do not match');const {error:authError}=await sb.auth.signInWithPassword({email:state.user.email,password:pw});if(authError)return toast('Account password is incorrect');const {error}=await sb.rpc('set_parent_pin',{target_family:state.family.id,new_pin:p});if(error)return toast(errText(error));state.hasParentPin=true;closeModal();toast('Parent PIN reset');state.parentUnlocked=true;state.view='parent';state.parentTab='home';render()}
async function verifyParent(tab){const pin=$('parentPinInput').value.trim();const {data,error}=await sb.rpc('verify_parent_pin',{target_family:state.family.id,candidate_pin:pin});if(error)return toast(errText(error));if(!data)return toast('Wrong Parent PIN');closeModal();state.parentUnlocked=true;state.view='parent';state.parentTab=tab||'home';render()}
function exitParent(){state.parentUnlocked=false;state.view='family';render()}
function parentTab(t){state.parentTab=t;render()}
function parentView(){const tabs=[['home','Home','⌂'],['chores','Chores','✓'],['approvals','Approvals','✓'],['kids','Kids','☺'],['reports','Reports','▤'],['settings','Settings','⚙']];let content=state.parentTab==='home'?parentHome():state.parentTab==='chores'?parentChores():state.parentTab==='approvals'?parentApprovals():state.parentTab==='kids'?parentKids():state.parentTab==='reports'?parentReports():parentSettings();return `${topbar()}<main>${content}</main><div class="bottomnav"><div class="navwrap">${tabs.map(t=>`<button class="navitem ${state.parentTab===t[0]?'active':''}" onclick="parentTab('${t[0]}')"><span>${t[2]}</span>${t[1]}${t[0]==='approvals'&&pendingCount()?` (${pendingCount()})`:''}</button>`).join('')}</div></div>`}
function parentHome(){const todayC=state.completions.filter(x=>x.due_date===today());const approved=todayC.filter(x=>x.status==='approved').length;const pending=todayC.filter(x=>x.status==='pending').length;return `<div class="row between"><div><h1>Parent Dashboard</h1><p>${esc(state.family.name)}</p></div><button class="primary" onclick="parentTab('approvals')">${pendingCount()} pending</button></div><div class="grid cols-4" style="margin-top:16px"><div class="card stat"><span class="small muted">Today's chores</span><b>${todayC.length}</b></div><div class="card stat"><span class="small muted">Approved</span><b>${approved}</b></div><div class="card stat"><span class="small muted">Waiting</span><b>${pending}</b></div><div class="card stat"><span class="small muted">Kids</span><b>${state.children.length}</b></div></div><div class="section-head"><h2>Balances</h2></div><div class="grid cols-3">${state.children.map(c=>`<div class="card"><div class="row"><div class="avatar">${esc(c.avatar||c.name[0])}</div><div><h3>${esc(c.name)}</h3><div class="small muted">Age ${c.age}</div></div></div><div class="big-balance" style="font-size:30px">${fmt(c,balance(c.id))}</div></div>`).join('')}</div>`}
function parentApprovals(){const comps=state.completions.filter(x=>x.status==='pending');const reds=state.redemptions.filter(x=>x.status==='pending');return `<div class="row between"><div><h1>Approvals</h1><p>Rewards hit the ledger only after approval.</p></div></div><div class="section-head"><h2>Chores</h2></div>${comps.length?`<div class="grid">${comps.map(x=>{const c=child(x.child_id),ch=chore(x.chore_id);return `<div class="card"><div class="row between"><div><span class="tag warn">WAITING</span><h3 style="margin-top:8px">${esc(ch?.name||'Chore')}</h3><div class="small muted">${esc(c?.name||'Child')} ${Number(ch?.reward_amount||0)?`• +${fmt(c,ch.reward_amount)}`:''}</div></div><div class="row"><button class="secondary reject" onclick="rejectCompletion('${x.id}')">Reject</button><button class="primary success" onclick="approveCompletion('${x.id}')">Approve</button></div></div></div>`}).join('')}</div>`:`<div class="card empty">No chores waiting.</div>`}<div class="section-head"><h2>Tablet time</h2></div>${reds.length?`<div class="grid">${reds.map(r=>{const c=child(r.child_id);return `<div class="card"><div class="row between"><div><h3>${esc(c?.name||'Child')} • ${r.minutes} minutes</h3><div class="small muted">Current balance ${fmt(c,balance(r.child_id))}</div></div><div class="row"><button class="secondary reject" onclick="rejectRedemption('${r.id}')">Reject</button><button class="primary success" onclick="approveRedemption('${r.id}')">Approve</button></div></div></div>`}).join('')}</div>`:`<div class="card empty">No tablet requests waiting.</div>`}`}
async function approveCompletion(id){const {error}=await sb.rpc('approve_chore_completion',{target_completion:id});if(error)return toast(errText(error));toast('Approved — ledger updated');await loadData();state.view='parent';state.parentUnlocked=true;state.parentTab='approvals'}
async function rejectCompletion(id){const {error}=await sb.from('chore_completions').update({status:'todo',reviewed_at:new Date().toISOString(),reviewed_by:state.user.id}).eq('id',id);if(error)return toast(errText(error));toast('Sent back to To Do');await loadData();state.view='parent';state.parentUnlocked=true;state.parentTab='approvals'}
async function approveRedemption(id){const {error}=await sb.rpc('approve_tablet_redemption',{target_redemption:id});if(error)return toast(errText(error));toast('Tablet time approved — balance deducted');await loadData();state.view='parent';state.parentUnlocked=true;state.parentTab='approvals'}
async function rejectRedemption(id){const {error}=await sb.rpc('reject_tablet_redemption',{target_redemption:id});if(error)return toast(errText(error));toast('Request rejected');await loadData();state.view='parent';state.parentUnlocked=true;state.parentTab='approvals'}

function parentKids(){return `<div class="row between"><div><h1>Kids</h1><p>Add children and manage their PINs.</p></div><button class="primary" onclick="addChildModal()">+ Add child</button></div><div class="grid cols-3" style="margin-top:15px">${state.children.map(c=>`<div class="card"><div class="row"><div class="avatar">${esc(c.avatar||c.name[0])}</div><div><h3>${esc(c.name)}</h3><div class="small muted">Age ${c.age} • ${c.reward_type==='money'?'Money':'Tablet minutes'}</div></div></div><div class="big-balance" style="font-size:30px">${fmt(c,balance(c.id))}</div><button class="secondary" style="width:100%" onclick="resetKidPin('${c.id}')">Reset PIN</button></div>`).join('')}</div>`}
function addChildModal(){modal(`<h2>Add child</h2><div class="formgrid"><label>Name<input id="newChildName" class="input"></label><label>Age<input id="newChildAge" class="input" type="number" min="3" max="18" value="6"></label><label>Reward type<select id="newChildReward" class="input"><option value="minutes">Tablet minutes</option><option value="money">Money</option></select></label><label>4-digit PIN<input id="newChildPin" class="input pin" inputmode="numeric" maxlength="4" type="password"></label></div><button class="primary" style="width:100%;margin-top:14px" onclick="addChild()">Add child</button>`)}
async function addChild(){const name=$('newChildName').value.trim(),age=Number($('newChildAge').value),reward=$('newChildReward').value,pin=$('newChildPin').value.trim();const {error}=await sb.rpc('create_child',{target_family:state.family.id,child_name:name,child_age:age,child_reward_type:reward,child_pin:pin,child_avatar:name?name[0].toUpperCase():null});if(error)return toast(errText(error));closeModal();toast('Child added');await loadData();state.view='parent';state.parentUnlocked=true;state.parentTab='kids'}
function resetKidPin(id){const c=child(id);modal(`<h2>Reset ${esc(c.name)}'s PIN</h2><label style="display:block;margin-top:12px">New 4-digit PIN<input id="resetPin" class="input pin" inputmode="numeric" maxlength="4" type="password"></label><button class="primary" style="width:100%;margin-top:14px" onclick="saveKidPin('${id}')">Save PIN</button>`)}
async function saveKidPin(id){const pin=$('resetPin').value.trim();const {error}=await sb.rpc('set_child_pin',{child:id,new_pin:pin});if(error)return toast(errText(error));closeModal();toast('PIN updated')}

function parentChores(){const q=state.librarySearch.toLowerCase();const lib=state.library.filter(x=>!q||x.name.toLowerCase().includes(q)||x.category.toLowerCase().includes(q)).slice(0,40);return `<div class="row between"><div><h1>Chores</h1><p>Assign from the cloud chore library or make your own.</p></div><button class="primary" onclick="customChoreModal()">+ Custom chore</button></div><div class="section-head"><h2>Assigned</h2></div><div class="card">${state.chores.length?state.chores.map(ch=>{const names=state.assignments.filter(a=>a.chore_id===ch.id).map(a=>child(a.child_id)?.name).filter(Boolean).join(', ');return `<div class="task"><div><div class="task-title">${esc(ch.name)}</div><div class="small muted">${esc(names||'Unassigned')} • ${esc(ch.chore_type)} • ${esc(ch.schedule_text||'Daily')}</div></div><span class="tag ${ch.active?'good':'bad'}">${ch.active?'ACTIVE':'PAUSED'}</span></div>`}).join(''):`<div class="empty">No chores assigned yet.</div>`}</div><div class="section-head"><h2>Chore library</h2></div><div class="toolbar"><input class="search" placeholder="Search 200+ chores" value="${esc(state.librarySearch)}" oninput="setLibrarySearch(this.value)"></div><div class="library" style="margin-top:12px">${lib.map(x=>`<div class="libcard"><div class="row between"><span class="tag blue">${esc(x.category)}</span><span class="small muted">Age ${x.min_age}–${x.max_age}</span></div><h3 style="margin-top:10px">${esc(x.name)}</h3><div class="small muted" style="margin:6px 0 12px">${esc(x.suggested_frequency)} • ${esc(x.difficulty)}</div><button class="secondary" style="width:100%" onclick="assignLibrary(${x.id})">Assign</button></div>`).join('')}</div>`}
function setLibrarySearch(v){state.librarySearch=v;render()}
function assignLibrary(id){const item=state.library.find(x=>Number(x.id)===Number(id));if(!state.children.length)return toast('Add a child first');modal(`<h2>Assign ${esc(item.name)}</h2><label style="display:block">Child<select id="assignChild" class="input">${state.children.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label><label style="display:block;margin-top:12px">Type<select id="assignType" class="input"><option value="${esc(item.suggested_type)}">${esc(item.suggested_type)}</option><option value="responsibility">responsibility</option><option value="earned">earned</option><option value="bonus">bonus</option></select></label><label style="display:block;margin-top:12px">Reward amount<input id="assignReward" class="input" type="number" step="1" value="0"></label><button class="primary" style="width:100%;margin-top:14px" onclick="saveLibraryAssignment(${item.id})">Assign chore</button>`)}
async function saveLibraryAssignment(id){const item=state.library.find(x=>Number(x.id)===Number(id)),childId=$('assignChild').value,type=$('assignType').value,reward=Number($('assignReward').value||0);const {data,error}=await sb.from('chores').insert({family_id:state.family.id,name:item.name,category:item.category,chore_type:type,schedule_text:type==='bonus'?'Bonus job':'Daily',reward_amount:reward,deduction_amount:0,approval_required:true,difficulty:item.difficulty,active:true}).select('id').single();if(error)return toast(errText(error));const {error:ae}=await sb.from('chore_assignments').insert({family_id:state.family.id,chore_id:data.id,child_id:childId});if(ae)return toast(errText(ae));closeModal();toast('Chore assigned');await loadData();state.view='parent';state.parentUnlocked=true;state.parentTab='chores'}
function customChoreModal(){if(!state.children.length)return toast('Add a child first');modal(`<h2>Custom chore</h2><div class="formgrid"><label>Name<input id="customName" class="input"></label><label>Category<input id="customCategory" class="input" value="Helping Family"></label><label>Child<select id="customChild" class="input">${state.children.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label><label>Type<select id="customType" class="input"><option value="responsibility">Responsibility</option><option value="earned">Earned</option><option value="bonus">Bonus job</option></select></label><label>Reward<input id="customReward" class="input" type="number" value="0"></label><label>Deduction<input id="customDeduction" class="input" type="number" value="0"></label></div><button class="primary" style="width:100%;margin-top:14px" onclick="saveCustomChore()">Create chore</button>`)}
async function saveCustomChore(){const name=$('customName').value.trim();if(!name)return toast('Enter a chore name');const type=$('customType').value;const {data,error}=await sb.from('chores').insert({family_id:state.family.id,name,category:$('customCategory').value.trim()||'Helping Family',chore_type:type,schedule_text:type==='bonus'?'Bonus job':'Daily',reward_amount:Number($('customReward').value||0),deduction_amount:Number($('customDeduction').value||0),approval_required:true,active:true}).select('id').single();if(error)return toast(errText(error));const {error:ae}=await sb.from('chore_assignments').insert({family_id:state.family.id,chore_id:data.id,child_id:$('customChild').value});if(ae)return toast(errText(ae));closeModal();toast('Chore created');await loadData();state.view='parent';state.parentUnlocked=true;state.parentTab='chores'}

function parentReports(){return `<h1>Reports</h1><p>The ledger is the source of truth for balances.</p><div class="section-head"><h2>Recent ledger activity</h2></div><div class="card tablewrap"><table class="table"><thead><tr><th>Date</th><th>Child</th><th>Reason</th><th>Type</th><th>Amount</th></tr></thead><tbody>${state.ledger.map(t=>{const c=child(t.child_id);return `<tr><td>${new Date(t.created_at).toLocaleDateString()}</td><td>${esc(c?.name||'')}</td><td>${esc(t.reason)}</td><td>${esc(t.transaction_type)}</td><td class="${Number(t.amount)>=0?'ledger-pos':'ledger-neg'}">${Number(t.amount)>=0?'+':''}${fmt(c,t.amount)}</td></tr>`}).join('')}</tbody></table></div>`}
function parentSettings(){const s=state.settings||{};return `<h1>Settings</h1><p>Family defaults and security.</p><div class="grid cols-2" style="margin-top:16px"><div class="card"><h3>Tablet time</h3><label style="display:block;margin-top:12px">Daily maximum<input id="setLimit" class="input" type="number" value="${s.tablet_daily_limit??60}"></label><label style="display:block;margin-top:12px">Minimum redemption<input id="setMin" class="input" type="number" value="${s.tablet_min_redemption??15}"></label></div><div class="card"><h3>Parent PIN</h3><p style="margin:8px 0 12px">Change the PIN used to unlock Parent Mode.</p><input id="newParentPin" class="input pin" inputmode="numeric" maxlength="8" type="password" placeholder="New PIN"><button class="secondary" style="width:100%;margin-top:10px" onclick="changeParentPin()">Change PIN</button></div></div><button class="primary" style="margin-top:14px" onclick="saveSettings()">Save settings</button>`}
async function saveSettings(){const {error}=await sb.from('family_settings').update({tablet_daily_limit:Number($('setLimit').value||60),tablet_min_redemption:Number($('setMin').value||15),updated_at:new Date().toISOString()}).eq('family_id',state.family.id);if(error)return toast(errText(error));toast('Settings saved');await loadData();state.view='parent';state.parentUnlocked=true;state.parentTab='settings'}
async function changeParentPin(){const pin=$('newParentPin').value.trim();const {error}=await sb.rpc('set_parent_pin',{target_family:state.family.id,new_pin:pin});if(error)return toast(errText(error));toast('Parent PIN changed');$('newParentPin').value=''}
